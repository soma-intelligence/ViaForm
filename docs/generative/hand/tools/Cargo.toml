[package]
name = "viaform-hand"
description = "Humanoid hand: studies, runs, assembly, motion checks and renders around docs/components/hand.json"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the ViaForm workspace (docs/ is not code the app builds).
[workspace]

[dependencies]
viaform-generative = { path = "../../../../generative" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
