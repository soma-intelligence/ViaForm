<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViaForm Pipeline</title>
<style>
:root{
  --bg:#1e1e20; --tb:#2b2b2e; --stb:#262629; --insp:#222225; --panel:#232326;
  --sep:rgba(0,0,0,.6); --hair:rgba(255,255,255,.075); --hair2:rgba(255,255,255,.13);
  --t1:rgba(255,255,255,.88); --t2:rgba(235,235,245,.60); --t3:rgba(235,235,245,.38); --t4:rgba(235,235,245,.2);
  --acc:#0a84ff; --accS:rgba(10,132,255,.2);
  --ok:#32d74b; --warn:#ff9f0a; --bad:#ff453a; --pur:#bf5af2; --teal:#64d2ff; --yel:#ffd60a;
  --ctl:rgba(255,255,255,.1); --ctlH:rgba(255,255,255,.15);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0d10;overflow:hidden}
body{font:13px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
.i{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11px}

.win{position:absolute;inset:0;display:flex;border-radius:10px;overflow:hidden;background:var(--bg)}
.win::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);pointer-events:none;z-index:50}

/* sidebar */
.sb{width:248px;flex:none;display:flex;flex-direction:column;position:relative;border-right:1px solid var(--sep);
  background:linear-gradient(180deg,rgba(52,50,62,.98) 0%,rgba(40,40,47,.98) 45%,rgba(37,37,42,.98) 100%)}
.sb-top{height:52px;flex:none;display:flex;align-items:center;padding:0 10px 0 20px;gap:8px}
.tl{display:flex;gap:8px;margin-right:auto}
.tl i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28)}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.sb-search{margin:0 10px 6px;height:24px;border-radius:6px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;padding:0 7px;color:var(--t3);font-size:12.5px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05)}
.sb-body{flex:1;overflow:hidden;padding-bottom:4px}
.sh{font-size:11px;font-weight:600;color:var(--t3);padding:10px 18px 3px 18px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em}
.sh .i{color:var(--t3)}
.row{height:24px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;margin:0 10px;border-radius:6px;font-size:12.5px;color:var(--t1);white-space:nowrap;position:relative}
.row:hover{background:rgba(255,255,255,.04)}
.row .dc{width:12px;color:var(--t3);display:grid;place-items:center;flex:none}
.row .ri{color:var(--acc)}
.row .lb{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .tr{color:var(--t3);font-size:11px;display:flex;align-items:center;gap:4px}
.row.sel{background:rgba(255,255,255,.1)}
.row.key{background:var(--acc);color:#fff}
.row.key .ri,.row.key .tr,.row.key .dc{color:rgba(255,255,255,.85)}
.row.dim{color:var(--t3)}
.sb-art{flex:none;border-top:1px solid var(--hair);padding:2px 0 10px}
.art{height:34px;display:flex;align-items:center;gap:8px;padding:0 8px;margin:0 10px;border-radius:6px}
.art:hover{background:rgba(255,255,255,.05)}
.art .a1{font-size:12px;line-height:1.15}
.art .a2{font-size:10.5px;color:var(--t3)}
.art .si{margin-left:auto}

/* main column */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:var(--tb);border-bottom:1px solid var(--sep);position:relative;z-index:5}
.ttl{width:150px;flex:none;line-height:1.15}
.ttl .t1{font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px}
.ttl .t2{font-size:11px;color:var(--t2)}
.tbb{height:28px;min-width:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--t2);position:relative;padding:0 5px}
.tbb:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.tbb.on{color:var(--t1)}
.tbb.act{background:rgba(255,255,255,.11);color:var(--t1)}
.tbsep{width:1px;height:18px;background:var(--hair2);margin:0 2px}
.badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;color:#1b1300;background:var(--warn);box-shadow:0 0 0 2px var(--tb)}

/* pipeline */
.pipe{flex:1;display:flex;justify-content:center;min-width:0}
.ptrack{display:flex;align-items:center;height:40px;padding:2px;border-radius:9px;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06),inset 0 1px 2px rgba(0,0,0,.25)}
.stg{height:36px;display:flex;align-items:center;gap:7px;padding:0 9px 0 7px;border-radius:7px;position:relative;white-space:nowrap}
.stg:hover{background:rgba(255,255,255,.05)}
.stg.cur{background:linear-gradient(rgba(255,255,255,.17),rgba(255,255,255,.12));box-shadow:0 .5px 0 rgba(255,255,255,.12) inset,0 1px 3px rgba(0,0,0,.35)}
.stg .ico{position:relative;color:var(--t2)}
.stg.cur .ico{color:var(--acc)}
.stg .st{position:absolute;right:-5px;bottom:-4px}
.stg .n{font-size:12px;font-weight:600;line-height:1.1;color:var(--t1)}
.stg .m{font-size:10.5px;color:var(--t3);line-height:1.15}
.stg .m.stale{color:var(--warn)}.stg .m.failed{color:var(--bad)}.stg .m.running{color:#4aa3ff}
.conn{width:14px;flex:none;display:grid;place-items:center}
.flowdash{animation:dash 0.9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-8}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* stage bar */
.below{flex:1;display:flex;min-height:0}
.detail{flex:1;display:flex;flex-direction:column;min-width:0}
.stb{height:58px;flex:none;display:flex;align-items:stretch;background:var(--stb);border-bottom:1px solid var(--sep);padding:0 8px 0 6px;gap:0}
.grp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 7px;position:relative}
.grp+.grp::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:1px;background:var(--hair)}
.grp .bt{display:flex;gap:1px}
.grp .gl{font-size:9.5px;font-weight:600;color:var(--t3);letter-spacing:.05em;margin-top:2px;display:flex;align-items:center;gap:1px}
.tbtn{width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--t1);position:relative}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.on{background:rgba(10,132,255,.22);color:#6cb4ff}
.tbtn .lk{position:absolute;right:2px;bottom:2px;color:var(--pur)}
.stb .sp{flex:1}
.stb .rt{display:flex;align-items:center;gap:8px;padding-left:8px}

/* controls */
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:7px;padding:2px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05);gap:1px}
.seg b{font-weight:500;font-size:11.5px;padding:0 10px;height:19px;display:flex;align-items:center;gap:5px;border-radius:5px;color:var(--t2)}
.seg b.on{background:#5b5b60;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.12)}
.seg.sm b{padding:0 8px;height:17px;font-size:11px}
.btn{height:22px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;background:rgba(255,255,255,.13);box-shadow:inset 0 .5px 0 rgba(255,255,255,.1),0 .5px 1.5px rgba(0,0,0,.45);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.pri{background:linear-gradient(#2e91ff,#0b7bff);color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.25),0 .5px 1.5px rgba(0,0,0,.45)}
.btn.warn{background:linear-gradient(#ffad2e,#f39400);color:#231500}
.btn.sm{height:19px;font-size:11px;padding:0 8px}
.btn.ghost{background:none;box-shadow:none;color:var(--acc);padding:0 4px}
.btn[disabled]{opacity:.45}
.pop{height:20px;padding:0 5px 0 8px;border-radius:5px;background:rgba(255,255,255,.11);box-shadow:inset 0 .5px 0 rgba(255,255,255,.08),0 .5px 1px rgba(0,0,0,.45);display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.pop .i{color:var(--t2)}
.fld{height:20px;border-radius:5px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);padding:0 6px;font:11.5px var(--mono);display:inline-flex;align-items:center;justify-content:flex-end;min-width:70px;color:var(--t1)}
.fld u{text-decoration:none;color:var(--t3);margin-left:3px;font-family:-apple-system,sans-serif;font-size:11px}
.sw{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.18);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;background:#e8e8ea;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.sw.on{background:var(--acc)}.sw.on::after{left:12.5px}
.chk{width:14px;height:14px;border-radius:4px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.chk.off{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.pb{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;flex:1}
.pb i{display:block;height:100%;background:var(--acc);border-radius:2px}
.pb.warn i{background:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.08);color:var(--t2);white-space:nowrap}
.tag.ok{background:rgba(50,215,75,.14);color:#5fe07a}.tag.stale{background:rgba(255,159,10,.15);color:#ffb340}
.tag.failed{background:rgba(255,69,58,.16);color:#ff6961}.tag.running{background:rgba(10,132,255,.18);color:#5eb0ff}
.tag.acc{background:rgba(10,132,255,.18);color:#5eb0ff}.tag.pur{background:rgba(191,90,242,.16);color:#d08cf5}

/* viewport */
.vp{flex:1;position:relative;overflow:hidden;min-height:0;background:linear-gradient(180deg,#474c57 0%,#2f333b 55%,#21252a 100%)}
.vp>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;z-index:3}
.glass{background:rgba(36,38,44,.66);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border-radius:10px;box-shadow:0 0 0 .5px rgba(255,255,255,.13) inset,0 0 0 .5px rgba(0,0,0,.5),0 8px 26px rgba(0,0,0,.35)}
.navcap{left:50%;bottom:12px;transform:translateX(-50%);height:34px;display:flex;align-items:center;gap:1px;padding:0 5px;border-radius:9px}
.navcap .tbtn{width:30px;height:26px;color:var(--t1)}
.navcap .vs{width:1px;height:16px;background:var(--hair2);margin:0 4px}
.selchip{left:12px;top:12px;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;border-radius:9px;font-size:12px}
.selchip .lk{display:flex;gap:2px}
.selchip .dotc{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--t2)}
.selchip .dotc.on{background:rgba(10,132,255,.25);color:#7cc0ff}
.banner{left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;border-radius:10px;font-size:12px;max-width:640px}
.banner .bi{color:var(--warn)}
.banner b{font-weight:600}
.banner .sub{color:var(--t2);font-size:11px}
.callout{position:absolute;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 6px;border-radius:7px;font-size:11px;white-space:nowrap}
.hud{position:absolute;z-index:3;padding:12px 14px;border-radius:12px;font-size:12px}
.hud .kv{display:flex;justify-content:space-between;gap:16px;height:20px;align-items:center}
.hud .kv span:first-child{color:var(--t2)}
.vp.fade svg.scene{animation:fade .28s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}

/* bottom panels */
.bot{flex:none;background:var(--panel);border-top:1px solid var(--sep);position:relative}
.bot .bh{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--hair);font-size:12px}
.bot .bh .tt{font-weight:600}
.bot .bh .mt{color:var(--t3);font-size:11px}
.tl-strip{height:44px;display:flex;align-items:center;gap:4px;padding:0 10px}
.tl-strip .tbtn{width:26px;height:26px;color:var(--t2)}
.feat{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--t1);position:relative;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06)}
.feat.gen{background:rgba(191,90,242,.2);color:#d9a0f8;box-shadow:inset 0 0 0 .5px rgba(191,90,242,.5)}
.feat.lnk{background:rgba(10,132,255,.16);color:#7cc0ff;box-shadow:inset 0 0 0 .5px rgba(10,132,255,.4)}
.feat.sel{box-shadow:0 0 0 1.5px var(--acc)}
.feat .lk{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#1d1d20;display:grid;place-items:center;color:#7cc0ff}
.marker{width:4px;height:30px;border-radius:2px;background:var(--acc);margin-left:4px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.sbar{height:24px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--sep);background:#1f1f22;font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden}
.sbar .sv{width:1px;height:12px;background:var(--hair2)}
.sbar b{font-weight:600;color:var(--t1)}

/* outcome grid */
.og{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:8px 10px 10px}
.oc{border-radius:8px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07);padding:4px 6px 5px;position:relative}
.oc:hover{background:rgba(255,255,255,.07)}
.oc.pick{box-shadow:0 0 0 2px var(--acc);background:rgba(10,132,255,.1)}
.oc svg{display:block;width:100%;height:56px}
.oc .ol{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t2)}
.oc .ol b{color:var(--t1);font-weight:600}
.oc .ob{position:absolute;top:5px;left:6px}

/* inspector */
.in{width:286px;flex:none;background:var(--insp);border-left:1px solid var(--sep);overflow:hidden;display:flex;flex-direction:column}
.in .ihd{height:34px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--hair)}
.in .isc{flex:1;overflow:auto;padding-bottom:70px}
.in .isc::-webkit-scrollbar{width:0}
.sec{padding:10px 14px 11px;border-bottom:1px solid var(--hair)}
.sec h4{font-size:11px;font-weight:700;color:var(--t2);margin:0 0 7px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em}
.sec h4 .i{color:var(--t3)}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:24px;font-size:12px;gap:8px}
.kv>span:first-child{color:var(--t2);white-space:nowrap}
.fl{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.035);margin-bottom:4px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.05);font-size:11.5px}
.fl:hover{background:rgba(255,255,255,.07)}
.fl .sic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--t2);flex:none}
.fl .ft{flex:1;min-width:0;line-height:1.2}
.fl .ft b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .ft span{color:var(--t3);font-size:10.5px}
.fl.stale{box-shadow:inset 0 0 0 .5px rgba(255,159,10,.45);background:rgba(255,159,10,.07)}
.fl.failed{box-shadow:inset 0 0 0 .5px rgba(255,69,58,.45);background:rgba(255,69,58,.07)}
.fl.running{box-shadow:inset 0 0 0 .5px rgba(10,132,255,.45)}
.flowlbl{font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.06em;margin:6px 0 4px;display:flex;align-items:center;gap:5px}
.lchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:10px;background:rgba(255,255,255,.07);font-size:11px;color:var(--t1)}
.lchip.cur{background:rgba(10,132,255,.22);color:#8cc8ff}
.lchip.stale{color:#ffb340}

/* popovers */
.popover{position:absolute;z-index:40;background:rgba(42,42,47,.9);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border-radius:12px;box-shadow:0 0 0 .5px rgba(255,255,255,.16) inset,0 0 0 .5px rgba(0,0,0,.6),0 22px 60px rgba(0,0,0,.55);display:none}
.popover.open{display:block;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.popover .arrow{position:absolute;top:-7px;width:14px;height:14px;transform:rotate(45deg);background:rgba(46,46,51,.98);border-radius:2px;box-shadow:-.5px -.5px 0 rgba(255,255,255,.16)}
.popover .ph{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.popover .ph .tt{font-weight:700;font-size:13px}
.popover .ph .mt{color:var(--t3);font-size:11px}
.job{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--hair)}
.job .jt{flex:1;min-width:0}
.job .jt b{font-weight:600;font-size:12px}
.job .jt .js{font-size:11px;color:var(--t2);margin-top:1px}
.hov{position:absolute;z-index:45;width:300px;padding:10px 12px 10px;display:none;pointer-events:none}
.hov.open{display:block}

.cap{position:fixed;right:14px;bottom:12px;z-index:100;max-width:286px;padding:8px 11px;border-radius:9px;background:rgba(10,10,12,.78);box-shadow:0 0 0 .5px rgba(255,255,255,.18) inset;font-size:10.5px;line-height:1.35;color:rgba(255,255,255,.72);pointer-events:none}
.cap b{color:#fff;font-weight:700;letter-spacing:.02em}
</style>
</head>
<body>
<div class="win" id="win">
  <aside class="sb" id="sb">
    <div class="sb-top">
      <div class="tl"><i></i><i></i><i></i></div>
      <button class="tbb" title="Hide Sidebar" id="sbToggle"></button>
    </div>
    <div class="sb-search" id="sbSearch"></div>
    <div class="sb-body" id="sbBody"></div>
    <div class="sb-art" id="sbArt"></div>
  </aside>
  <section class="main">
    <header class="tb">
      <div class="ttl"><div class="t1" id="docTitle"></div><div class="t2" id="docSub"></div></div>
      <div class="pipe"><div class="ptrack" id="pipe"></div></div>
      <div style="display:flex;align-items:center;gap:2px" id="tbRight"></div>
    </header>
    <div class="below">
      <div class="detail">
        <div class="stb" id="stb"></div>
        <div class="vp" id="vp"></div>
        <div class="bot" id="bot"></div>
        <div class="sbar" id="sbar"></div>
      </div>
      <aside class="in" id="insp"></aside>
    </div>
  </section>
  <div class="popover" id="graphPop" style="width:604px"></div>
  <div class="popover" id="jobsPop" style="width:380px"></div>
  <div class="popover hov" id="hov"></div>
</div>
<div class="cap"><b>C · PRODUCT PIPELINE</b><br>Eight stages in one row of the toolbar, one shared viewport. Each stage shows what it consumes, what it produces and whether it is current.</div>
<script>
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const pt=p=>p[0].toFixed(1)+','+p[1].toFixed(1);

    view(x,y,z){x-=t[0];y-=t[1];z-=t[2];const x1=x*ca-y*sa,y1=x*sa+y*ca;return[x1,y1*se+z*ce,-y1*ce+z*se];},
    rot(x,y,z){const x1=x*ca-y*sa,y1=x*sa+y*ca;return[x1,y1*se+z*ce,-y1*ce+z*se];},
    p(x,y,z){const v=C.view(x,y,z);if(persp){const zc=o.D-v[2];const k=o.f/zc;return[o.cx+v[0]*k,o.cy-v[1]*k,v[2],zc];}return[o.cx+v[0]*o.s,o.cy-v[1]*o.s,v[2],0];},

      const d=Math.max(0,dot3(nv,L)),f=Math.max(0,dot3(nv,F))*.16,s=Math.pow(Math.max(0,dot3(nv,H)),sh)*sp;

/* extruded profile: loops in XY, z0..z1. Returns SVG (walls far to near, silhouette edges, then the cap) or depth-tagged items */
function ext(C,o){

    const n=L.length,fac=new Array(n),nr=new Array(n);

    }
    for(let i=0;i<n;i++){
      if(!fac[i])continue;const a=L[i],b=L[(i+1)%n];

      walls.push([(p1[2]+p2[2]+p3[2]+p4[2])/4,`<path d="M${pt(p1)}L${pt(p2)}L${pt(p3)}L${pt(p4)}Z" fill="${col}" stroke="${col}" stroke-width=".7"/>`]);

      if(d){const a=L[i];edges+=`M${pt(C.p(a[0],a[1],o.z0))}L${pt(C.p(a[0],a[1],o.z1))}`;}}

  const topFill=o.topFill||C.shade([0,0,1],o.col,mat,tzc/tc);
  const es=o.edge?` stroke="${o.edge}" stroke-width="${o.ew||.8}" stroke-linejoin="round"${o.dash?` stroke-dasharray="${o.dash}"`:''}`:'';
  const capS=o.edge?es:` stroke="${topFill}" stroke-width=".5"`;
  if(o.noCap)return `<g>${walls.map(w=>w[1]).join('')}${edges?`<path d="${edges}" fill="none"${es}/>`:''}</g>`;
  if(o.items){const it=walls.map(w=>[w[0],w[1]]);it.push([tz/tc+.001,`<path d="${top}" fill="${topFill}" fill-rule="evenodd"${capS}/>`]);return it;}
  return `<g${o.op!==undefined?` opacity="${o.op}"`:''}${o.filter?` filter="${o.filter}"`:''}>${walls.map(w=>w[1]).join('')}${edges?`<path d="${edges}" fill="none"${es}/>`:''}<path d="${top}" fill="${topFill}" fill-rule="evenodd"${capS}/>${o.topOver?`<path d="${top}" fill="${o.topOver}" fill-rule="evenodd"/>`:''}</g>`;
}
const loopCircle=(cx,cy,r,n=36)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];});
function loopRect(cx,cy,hx,hy,r=0,rot=0){
  const P=[];const cs=[[hx-r,hy-r,0],[-hx+r,hy-r,1],[-hx+r,-hy+r,2],[hx-r,-hy+r,3]];
  for(const [x,y,q] of cs){if(r>0){for(let k=0;k<=4;k++){const a=(q+k/4)*Math.PI/2;P.push([x+r*Math.cos(a),y+r*Math.sin(a)]);}}else P.push([q===0||q===3?hx:-hx,q<2?hy:-hy]);}

/* polygon on a plane given 3D points (for lens, gate faces, arrows) */
function poly3(C,pts,fill,extra=''){return `<path d="M${pts.map(q=>pt(C.p(q[0],q[1],q[2]))).join('L')}Z" fill="${fill}" ${extra}/>`;}

/* ---------- signed distance fields and contouring ---------- */
const sd={
  circle:(x,y,cx,cy,r)=>Math.hypot(x-cx,y-cy)-r,
  rrect:(x,y,cx,cy,hx,hy,r)=>{const qx=Math.abs(x-cx)-hx+r,qy=Math.abs(y-cy)-hy+r;return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-r;},
  seg:(x,y,ax,ay,bx,by,ra,rb)=>{const pax=x-ax,pay=y-ay,bax=bx-ax,bay=by-ay;let h=(pax*bax+pay*bay)/(bax*bax+bay*bay);h=clamp(h,0,1);return Math.hypot(pax-bax*h,pay-bay*h)-(ra+(rb-ra)*h);},
  smin:(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25;},
};
function simplify(L,tol){if(L.length<10)return L;const out=[L[0]];for(let i=1;i<L.length-1;i++){const a=out[out.length-1],b=L[i],c=L[i+1];const cr=Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]));const len=Math.hypot(c[0]-a[0],c[1]-a[1])||1;if(cr/len>tol||Math.hypot(b[0]-a[0],b[1]-a[1])>4)out.push(b);}out.push(L[L.length-1]);return out;}

  const nx=Math.ceil((X1-X0)/h),ny=Math.ceil((Y1-Y0)/h),W=nx+1;const v=new Float64Array(W*(ny+1));
  for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++)v[j*W+i]=f(X0+i*h,Y0+j*h);
  const pts=new Map(),adj=new Map();
  const P=(k,ax,ay,va,bx,by,vb)=>{if(!pts.has(k)){const t=va/(va-vb);pts.set(k,[ax+(bx-ax)*t,ay+(by-ay)*t]);}return k;};
  const link=(a,b)=>{if(!adj.has(a))adj.set(a,[]);if(!adj.has(b))adj.set(b,[]);adj.get(a).push(b);adj.get(b).push(a);};
  const T={1:[[0,3]],2:[[0,1]],3:[[1,3]],4:[[1,2]],5:[[0,1],[2,3]],6:[[0,2]],7:[[2,3]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]};
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const a=v[j*W+i],b=v[j*W+i+1],c=v[(j+1)*W+i+1],d=v[(j+1)*W+i];
    const cs=(a<0?1:0)|(b<0?2:0)|(c<0?4:0)|(d<0?8:0);if(cs===0||cs===15)continue;
    const x0=X0+i*h,y0=Y0+j*h,x1=x0+h,y1=y0+h;
    const E=[()=>P('h'+i+'_'+j,x0,y0,a,x1,y0,b),()=>P('v'+(i+1)+'_'+j,x1,y0,b,x1,y1,c),()=>P('h'+i+'_'+(j+1),x0,y1,d,x1,y1,c),()=>P('v'+i+'_'+j,x0,y0,a,x0,y1,d)];
    for(const [e1,e2] of T[cs])link(E[e1](),E[e2]());

  for(const k of adj.keys()){if(seen.has(k))continue;const loop=[];let cur=k,prev=null;

    if(loop.length>3)loops.push(simplify(loop,.05));}

}

/* ---------- the 3-inch frame: arms, pads and webs blended, mount and lightening holes cut ---------- */
const FRAME_BASE={mx:46,my:48,bx:12.5,by:27,br:7,rw:9,tw:6.6,k:6,pad:9.4,slots:1,brace:1,ring:30};
function frameSDF(p){
  const M=[[-p.mx,-p.my],[p.mx,-p.my],[p.mx,p.my],[-p.mx,p.my]];
  const R=M.map(([x,y])=>[Math.sign(x)*p.bx*.45,Math.sign(y)*p.by*.6]);
  return (x,y)=>{
    let d=sd.rrect(x,y,0,0,p.bx,p.by,p.br);
    for(let i=0;i<4;i++){d=sd.smin(d,sd.seg(x,y,R[i][0],R[i][1],M[i][0],M[i][1],p.rw/2,p.tw/2),p.k);d=sd.smin(d,sd.circle(x,y,M[i][0],M[i][1],p.pad),p.k*.7);}
    if(p.brace===1){for(const [i,j] of [[0,1],[3,2]]){const a=lerp2(R[i],M[i],.52),b=lerp2(R[j],M[j],.52);d=sd.smin(d,sd.seg(x,y,a[0],a[1],b[0],b[1],1.5,1.5),p.k*.6);}}
    else if(p.brace===2){d=sd.smin(d,Math.abs(sd.circle(x,y,0,0,p.ring))-1.4,p.k*.6);}
    else if(p.brace===3){for(const [i,j] of [[0,3],[1,2]]){const a=lerp2(R[i],M[i],.45),b=lerp2(R[j],M[j],.45);d=sd.smin(d,sd.seg(x,y,a[0],a[1],b[0],b[1],1.4,1.4),p.k*.6);}}
    let h=sd.rrect(x,y,0,0,4.6,5.4,2.3);
    h=Math.min(h,sd.rrect(x,y,0,-19.5,6.5,1.5,1.5),sd.rrect(x,y,0,19.5,6.5,1.5,1.5));
    for(const sx of [-10,10])for(const sy of [-10,10])h=Math.min(h,sd.circle(x,y,sx,sy,1.3));
    for(let i=0;i<4;i++){const [mx,my]=M[i];h=Math.min(h,sd.circle(x,y,mx,my,2.7));
      for(let k=0;k<4;k++){const a=Math.PI/4+k*Math.PI/2;h=Math.min(h,sd.circle(x,y,mx+4.6*Math.cos(a),my+4.6*Math.sin(a),1.1));}
      if(p.slots>0){const w=p.rw*.17;const S=p.slots===1?[[.30,.64]]:[[.24,.43],[.51,.68]];
        for(const [t0,t1] of S){const a=lerp2(R[i],M[i],t0),b=lerp2(R[i],M[i],t1);h=Math.min(h,sd.seg(x,y,a[0],a[1],b[0],b[1],w,w*.78));}}}

    return Math.max(d,-h);
  };
}

/* ---------- generative outcomes (64 deterministic variants) ---------- */

  const c12=out[11];c12.p={...FRAME_BASE};c12.mass=10.4;c12.sf=2.31;c12.disp=0.071;

  const c3=out[2];c3.p={...FRAME_BASE,rw:10.5,tw:7.4,k:8,slots:1,brace:2};c3.mass=11.6;c3.sf=2.62;c3.disp=0.064;

function blade(C,mx,my,z,ang,dir){const P=[],Q=[];for(let i=0;i<=10;i++){const r=3+i*3.4;const cw=(6.6*(1-Math.pow(r/40,2))+1.4);const sw=r*.08*dir;

function drone(C,o){
  const S=SCH[o.scheme||'cad'],p=o.p||FRAME_BASE,sel=o.sel,ex=o.exploded,E=o.edges===false?null:S.edge;
  const X=ex?{bat:-30,esc:14,fc:28,mot:12,prop:26,cam:9}:{bat:0,esc:0,fc:0,mot:0,prop:0,cam:0};
  const mat=S.mat,M=MOT(p),out=[];
  const R=SCH.cad;const col=k=>S[k]||R[k];
  // battery under the frame
  if(o.battery!==false){
    out.push(box(C,0,0,15,31,-22+X.bat,-1+X.bat,hlc(col('bat'),sel==='battery'),mat,sel==='battery'?'#2f8bff':E,2.2));
    if(o.scheme==='render')out.push(box(C,0,0,15.25,31.25,-15+X.bat,-9+X.bat,[230,180,40],mat,null,2.3,0,{noCap:true,topFill:'none'}));
  }
  // frame
  const fl=frameLoops(p,o.res||.5);
  const fo={loops:fl.loops,sdf:fl.f,z0:0,z1:3,col:hlc(o.frameCol||col('frame'),sel==='frame'&&!o.noSel),mat,edge:sel==='frame'&&!o.noSel&&E?'#3c95ff':E,ew:.85};
  if(o.scheme==='render'){fo.topFill='url(#carbon)';fo.topOver='url(#sheen)';}
  if(o.stress){fo.topFill='url(#stressG)';fo.wallFill='url(#stressW)';fo.edge='#101216';}
  out.push(ext(C,fo));
  const groups=[];
  if(o.stack!==false){
    let g='';const so=col('so');
    const holes=[[-10,-10],[10,-10],[10,10],[-10,10]];
    if(!ex){for(const [x,y] of holes)g+=cyl(C,x,y,1.5,3,6,so,mat,E,14);}
    else{for(const [x,y] of holes){g+=`<path d="M${pt(C.p(x,y,3))}L${pt(C.p(x,y,13.6+X.fc))}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/>`;}}
    g+=box(C,0,0,13.5,13.5,6+X.esc,7.6+X.esc,col('esc'),mat,E,1.2);
    for(const [x,y] of [[-6,-6],[6,-6],[6,6],[-6,6]])g+=box(C,x,y,2.2,2.6,7.6+X.esc,8.6+X.esc,col('comp'),mat,E,.3);
    g+=box(C,0,0,3.2,3.2,7.6+X.esc,8.4+X.esc,col('comp'),mat,E,.3,Math.PI/4);
    if(!ex){for(const [x,y] of holes)g+=cyl(C,x,y,1.5,7.6,12,so,mat,E,14);}
    const bsel=sel==='board';
    g+=box(C,0,0,12.75,12.75,12+X.fc,13.6+X.fc,hlc(col('fc'),bsel),mat,bsel?'#3c95ff':E,1.5);
    g+=box(C,0,0,3.6,3.6,13.6+X.fc,14.6+X.fc,hlc(col('comp'),bsel),mat,E,.3);
    g+=box(C,-3,-8.4,1.25,1.5,13.6+X.fc,14.5+X.fc,sel==='imu'?[40,140,255]:hlc(col('comp'),bsel),mat,sel==='imu'?'#7cc0ff':E,.2);
    g+=box(C,2.6,-8.4,1,1,13.6+X.fc,14.4+X.fc,col('comp'),mat,E,.2);
    g+=box(C,11.2,0,1.5,4.4,13.6+X.fc,16.8+X.fc,col('usb'),{spec:.5},E,1.2);
    g+=box(C,0,11,4.5,1.5,13.6+X.fc,16+X.fc,col('jst'),mat,E,.3);
    if(!ex){for(const [x,y] of holes)g+=cyl(C,x,y,1.9,13.6,15.6,so,mat,E,6);}
    groups.push([C.p(0,0,10)[2],g]);
  }
  M.forEach(([mx,my],i)=>{
    const ms=sel==='motor'&&i===1;let g='';const z=X.mot;
    g+=cyl(C,mx,my,9,3+z,5.6+z,hlc(col('mb'),ms),mat,ms?'#3c95ff':E,36);
    g+=cyl(C,mx,my,9,5.6+z,14.6+z,hlc(col('bell'),ms),{...mat,spec:(mat.spec||.2)+.15},ms?'#3c95ff':E,36);
    g+=cyl(C,mx,my,4.2,14.6+z,15.8+z,col('cap'),mat,E,24);
    g+=cyl(C,mx,my,1.3,15.8+z,19+z,col('shaft'),{spec:.6},E,12);
    groups.push([C.p(mx,my,10)[2],g]);
  });
  if(o.camera!==false){
    let g=box(C,0,-30+-X.cam*0,7,6,3+X.cam,16+X.cam,col('cam'),mat,sel==='camera'?'#3c95ff':E,1.4);
    const lens=[];for(let i=0;i<=28;i++){const a=i/28*Math.PI*2;lens.push(C.p(4.3*Math.cos(a),-36.05,9.5+X.cam+4.3*Math.sin(a)));}
    g+=`<path d="M${lens.map(pt).join('L')}Z" fill="url(#lens)" stroke="${o.scheme==='render'?'#e2632b':'#5a5f69'}" stroke-width="1.2"/>`;
    groups.push([C.p(0,-30,9)[2],g]);
    groups.push([C.p(0,27,12)[2],cyl(C,0,27,1.3,3,24,o.scheme==='render'?[30,31,35]:[84,88,96],mat,E,12)+cyl(C,0,27,2,22,26,o.scheme==='render'?[226,96,40]:[110,116,126],mat,E,14)]);
  }
  groups.sort((a,b)=>a[0]-b[0]);out.push(...groups.map(g=>g[1]));
  // props
  if(o.props&&o.props!=='none'){
    const pr=[];M.forEach(([mx,my],i)=>{const z=19.5+X.prop;let g='';
      if(o.props==='ghost'){const P=circle3(C,mx,my,z,38,56);g=`<path d="M${P.map(pt).join('L')}Z" fill="rgba(170,195,235,.07)" stroke="rgba(190,210,240,.32)" stroke-dasharray="4 4"/>`;}
      else{const dir=i%2?1:-1;const disc=circle3(C,mx,my,z,38,56);
        g=`<path d="M${disc.map(pt).join('L')}Z" fill="${o.props==='render'?'rgba(40,44,52,.18)':'rgba(170,195,235,.06)'}" stroke="${o.props==='render'?'rgba(255,255,255,.05)':'rgba(190,210,240,.16)'}"/>`;
        for(let b=0;b<3;b++){const P=blade(C,mx,my,z,(i*37+b*120)*D2R,dir).map(q=>C.p(q[0],q[1],q[2]));
          g+=`<path d="M${P.map(pt).join('L')}Z" fill="${o.props==='render'?'rgba(26,30,38,.82)':'rgba(205,212,222,.55)'}" stroke="${o.props==='render'?'rgba(150,170,200,.35)':'rgba(20,22,26,.6)'}" stroke-width=".7"/>`;}
        g+=cyl(C,mx,my,3.4,z-1,z+.6,o.props==='render'?[30,32,36]:[150,156,166],mat,E,16);}
      pr.push([C.p(mx,my,z)[2],g]);});
    pr.sort((a,b)=>a[0]-b[0]);out.push(...pr.map(g=>g[1]));
  }
  return out.join('');
}
function shadowEl(C,z,r,op=.42,blur='blur12',k=1){const o=C.p(0,0,z);return `<ellipse cx="${o[0]}" cy="${o[1]}" rx="${C.o.s*r}" ry="${C.o.s*r*C.se*k}" fill="#000" opacity="${op}" filter="url(#${blur})"/>`;}
function designCam(w,h,k=1,dx=0,dy=0){const s=Math.min(w/250,h/218)*k;return camera({az:-25*D2R,el:31*D2R,s,cx:w*.5+dx,cy:h*.53+dy});}

/* ---------- Design ---------- */
function sceneDesign(w,h){

  let s=svgDefs()+grid(C,-22,220,10,50,'gm1')+shadowEl(C,-22,78,.38)+shadowEl(C,-22,32,.5,'blur5',1.6);
  s+=drone(C,{p,sel:ST.sel,props:'ghost'});

  s+=arrow2([(a[0]+b[0])/2,(a[1]+b[1])/2],a,'rgba(235,240,250,.75)',1,6)+arrow2([(a[0]+b[0])/2,(a[1]+b[1])/2],b,'rgba(235,240,250,.75)',1,6);
  s+=pill((a[0]+b[0])/2,(a[1]+b[1])/2,`${(p.mx*2).toFixed(2)} mm`,{anchor:'middle',mono:true,w:76});

  const bp=C.p(12.75,-12.75,13.6);s+=`<path d="M${pt(bp)}L${(bp[0]+70).toFixed(1)},${(bp[1]-92).toFixed(1)}" stroke="rgba(124,192,255,.7)" stroke-width="1"/><circle cx="${bp[0]}" cy="${bp[1]}" r="2.6" fill="#7cc0ff"/>`;
  s+=pill(bp[0]+70,bp[1]-92,'Board rev C · linked',{icon:'cpu',ic:'#7cc0ff',w:150});
  return s;
}

/* ---------- Simulate: course, flight and stress ---------- */
const WP=[[0,0,.3],[0,4,1.2],[0,8,1.05],[1,12,1.25],[-1,14.5,1.35],[1,17,1.25],[-2.5,21,1.05],[-1.6,25,1.4],[-.4,28.4,1.6],[1.2,32,1.7],[2.5,38,1.05],[1.4,42.5,1.2],[.4,45,.9],[0,46,.35]];
function spline(P,seg=12){const out=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let k=0;k<seg;k++){const t=k/seg,t2=t*t,t3=t2*t;out.push([0,1,2].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)));}}out.push(P[P.length-1]);return out;}
const PATH=spline(WP);
const TREES=(()=>{const r=rng(11),T=[];for(let i=0;i<30;i++){const side=i%2?1:-1;T.push([side*(6.5+r()*16),-6+r()*84,1+r()*.9,3.6+r()*3.4]);}return T;})();
function cone(C,cx,cy,z0,hh,r,col,n=14){const it=[];const ap=[cx,cy,z0+hh];for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;const b0=[cx+r*Math.cos(a0),cy+r*Math.sin(a0),z0],b1=[cx+r*Math.cos(a1),cy+r*Math.sin(a1),z0];
  const am=(a0+a1)/2,nn=norm3([Math.cos(am)*hh,Math.sin(am)*hh,r]);const c=[(ap[0]+b0[0]+b1[0])/3,(ap[1]+b0[1]+b1[1])/3,(ap[2]+b0[2]+b1[2])/3];if(C.facing(nn,c)<=0)continue;
  const P=[ap,b0,b1].map(q=>C.p(q[0],q[1],q[2]));const fc=C.shade(nn,col,{amb:.42,dif:.55,spec:.03},(P[1][3]+P[2][3])/2);it.push([(P[0][2]+P[1][2]+P[2][2])/3,`<path d="M${P.map(pt).join('L')}Z" fill="${fc}" stroke="${fc}" stroke-width=".6"/>`]);}return it;}
function courseItems(C,o={}){
  const it=[];const I=a=>{for(const x of a)it.push(x);};const m={amb:.45,dif:.55,spec:.08};
  const gate=(x,y,hh,c)=>{for(const sx of [-.85,.85])I(ext(C,{loops:[loopRect(x+sx,y,.07,.07)],z0:0,z1:hh,col:c,mat:m,items:true}));I(ext(C,{loops:[loopRect(x,y,.92,.07)],z0:hh-.14,z1:hh,col:c,mat:m,items:true}));};
  gate(0,8,1.9,[255,122,26]);gate(-2.5,21,1.9,[255,122,26]);gate(2.5,38,1.9,[255,122,26]);
  [[1.2,12],[-1.2,14.5],[1.2,17]].forEach(([x,y])=>{for(let k=0;k<5;k++)I(ext(C,{loops:[loopCircle(x,y,.11,14)],z0:k*.42,z1:(k+1)*.42,col:k%2?[236,236,238]:[222,52,46],mat:m,items:true}));});
  I(ext(C,{loops:[loopRect(3.6,28.4,2.4,.11)],z0:0,z1:2.7,col:[112,124,142],mat:m,items:true}));
  I(ext(C,{loops:[loopRect(1.2,32,1.7,.05)],z0:1.02,z1:1.1,col:[240,200,60],mat:m,items:true}));
  for(const sx of [-.5,2.9])I(ext(C,{loops:[loopRect(sx,32,.05,.05)],z0:0,z1:1.1,col:[240,200,60],mat:m,items:true}));
  I(ext(C,{loops:[loopRect(0,0,.7,.7,.1)],z0:0,z1:.04,col:[58,62,70],mat:m,items:true}));I(ext(C,{loops:[loopRect(0,46,.7,.7,.1)],z0:0,z1:.04,col:[58,62,70],mat:m,items:true}));
  for(const [x,y,r,hh] of TREES){I(cone(C,x,y,.6,hh,r,[46,96,52]));I(ext(C,{loops:[loopCircle(x,y,.14,8)],z0:0,z1:.7,col:[92,70,52],mat:m,items:true}));}
  return it;
}
function ground(C,o){let s='';const tiles=[];for(let x=-66;x<66;x+=6)for(let y=-14;y<170;y+=8){const P=[[x,y],[x+6,y],[x+6,y+8],[x,y+8]].map(q=>C.p(q[0],q[1],0));
  const base=((x/6)|0)%2?[98,142,74]:[90,133,68];const zc=(P[0][3]+P[2][3])/2;const c=C.shade([0,0,1],o.flat?[58,64,62]:base,{amb:.62,dif:.4,spec:0},zc);tiles.push([(P[0][2]+P[2][2])/2,`<path d="M${P.map(pt).join('L')}Z" fill="${c}" stroke="${c}" stroke-width=".6"/>`]);}
  tiles.sort((a,b)=>a[0]-b[0]);return tiles.map(t=>t[1]).join('');}
function miniDrone(C,pos,k,yaw){const f=frameLoops(cand(ST.applied).p,2);const c=Math.cos(yaw),sn=Math.sin(yaw);
  const L=f.loops.map(l=>l.map(([x,y])=>[pos[0]+(x*c-y*sn)*k,pos[1]+(x*sn+y*c)*k]));const sdf=(x,y)=>{const u=(x-pos[0])/k,v=(y-pos[1])/k;return f.f(u*c+v*sn,-u*sn+v*c);};
  let g=ext(C,{loops:L,sdf,z0:pos[2],z1:pos[2]+3*k,col:[40,44,50],mat:{spec:.4},edge:'#0a0b0d',ew:.5});
  for(const [mx,my] of MOT(FRAME_BASE)){const x=pos[0]+(mx*c-my*sn)*k,y=pos[1]+(mx*sn+my*c)*k;g+=cyl(C,x,y,9*k,pos[2]+3*k,pos[2]+14*k,[208,70,34],{spec:.5},null,14);
    const P=circle3(C,x,y,pos[2]+19*k,38*k,24);g+=`<path d="M${P.map(pt).join('L')}Z" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.35)" stroke-width=".6"/>`;}
  return g;}
function simCam(w,h,o={}){return camera({az:(o.az??-9)*D2R,el:(o.el??13)*D2R,D:o.D??30,f:w*(o.f??.9),cx:w*.5,cy:h*(o.cy??.47),t:o.t||[0,19,0],fog:o.fog===false?null:[18,95,[201,214,224]]});}
function sceneSimFlight(w,h){

  let s=svgDefs()+`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c9fc4"/><stop offset="1" stop-color="#c9d6e0"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#sky)"/>`;
  s+=`<rect y="${hz[1]-2}" width="${w}" height="${h}" fill="#c9d6e0"/>`+ground(C,{});
  const it=courseItems(C);
  const n=PATH.length,cut=Math.round(n*ST.simF);

  return `<div style="display:flex;align-items:center;height:${h+6}px"><div style="width:120px;font-size:11px;color:var(--t2);padding-left:10px">${label} <span style="color:var(--t3)">${unit}</span></div><svg width="${w}" height="${h}" style="flex:1"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.4"/><path d="M${mark*w},0V${h}" stroke="#fff" stroke-width="1"/></svg></div>`;}
function chart(w,h,o){const P=18,B=18;const X=t=>P+t*(w-P-8),Y=v=>8+(1-(v-o.min)/(o.max-o.min))*(h-8-B);
  let s=`<svg width="${w}" height="${h}" style="display:block">`;for(let k=0;k<=4;k++){const v=o.min+(o.max-o.min)*k/4;s+=`<path d="M${P},${Y(v).toFixed(1)}H${w-8}" stroke="rgba(255,255,255,.06)"/><text x="${P-4}" y="${Y(v)+3}" font-size="9" fill="rgba(235,235,245,.38)" text-anchor="end">${o.fmt(v)}</text>`;}
  const now=o.now;let d='',up='',lo='';for(let i=0;i<=160;i++){const t=i/160*now;const v=o.f(t),b=o.band?o.band(t):0;d+=(i?'L':'M')+X(t).toFixed(1)+','+Y(v).toFixed(1);up+=(i?'L':'M')+X(t).toFixed(1)+','+Y(v+b).toFixed(1);lo=`L${X(t).toFixed(1)},${Y(v-b).toFixed(1)}`+lo;}
  if(o.band)s+=`<path d="${up}${lo}Z" fill="${o.col}" opacity=".16"/>`;
  if(o.base!==undefined)s+=`<path d="M${P},${Y(o.base)}H${w-8}" stroke="rgba(255,255,255,.45)" stroke-dasharray="4 3"/><text x="${w-10}" y="${Y(o.base)-4}" font-size="9" fill="rgba(235,235,245,.6)" text-anchor="end">${o.baseL}</text>`;
  s+=`<path d="${d}" fill="none" stroke="${o.col}" stroke-width="1.8"/><circle cx="${X(now)}" cy="${Y(o.f(now))}" r="3.4" fill="${o.col}" stroke="#1d1d20" stroke-width="1.5"/><path d="M${X(now)},8V${h-B}" stroke="rgba(255,255,255,.25)" stroke-dasharray="2 3"/>`;
  s+=`<text x="${P}" y="${h-4}" font-size="9" fill="rgba(235,235,245,.38)">0</text><text x="${w-8}" y="${h-4}" font-size="9" fill="rgba(235,235,245,.38)" text-anchor="end">3.6 M steps</text></svg>`;return s;}

    const W=1;return `<div class="bh"><span class="tt">Flight · Run ${sm==='ok'?24:23}</span><span class="tag ${sm==='ok'?'ok':'stale'}">rev ${ST.used.simulate}</span><button class="tbtn" style="width:24px;height:22px">${ic('back',12)}</button><button class="tbtn" style="width:24px;height:22px" data-act="play">${ic(ST.playing?'pause':'play',12)}</button><button class="tbtn" style="width:24px;height:22px">${ic('fwd',12)}</button>${popb('1×')}<span class="num" style="font-size:11.5px">${(31.4*ST.simF).toFixed(1)} / 31.4 s</span><div style="flex:1"></div><span class="mt">Waypoints ${Math.round(ST.simF*13)+1} / 14</span></div>

    +(rs==='stale'?banner('stale','Preview shows assembly rev '+ST.used.render,`Rev ${ST.asm} changed Frame and mass. The queued Hero shot is paused.`,`<button class="btn warn" data-act="rerender">${ic('refresh',12)}Requeue on rev ${ST.asm}</button>`):rs==='running'?banner('running','Rendering on rev '+ST.asm,`Hero 3/4 · ${pct(ST.prog.render)}`,''):'');}
  if(s==='make'){bg='#17191d';svg=sceneMake(w,h);ov=(ST.makeFail?banner('failed','Preflight failed on 1 of 6 outputs','Camera mount 3MF: overhang 62° on the lens lip, limit 55°.',`<button class="btn" data-act="fixmake">Auto-orient</button><button class="btn" data-stage="design">Open in Design</button>`):status('make')==='running'?banner('running','Orienting camera mount','Searching 24 orientations',''):'')
    +`<div class="ov glass" style="right:12px;bottom:12px;width:220px;padding:9px 11px;border-radius:10px;font-size:11.5px"><div style="display:flex;justify-content:space-between;font-weight:600">Camera mount · TPU ${stBadge(ST.makeFail?'failed':'ok',0,13)}</div><svg width="198" height="90">${(()=>{const C=camera({az:-30*D2R,el:30*D2R,s:2.9,cx:99,cy:52});const U=[[-14,-6],[14,-6],[14,6],[9,6],[9,-1],[-9,-1],[-9,6],[-14,6]];return ext(C,{loops:[U],z0:0,z1:14,col:[70,72,80],mat:{},edge:'#0e1014',wallFill:null})+(ST.makeFail?poly3(C,[[-9,-1,7],[9,-1,7],[9,-1,14],[-9,-1,14]],'rgba(255,69,58,.55)'):'');})()}</svg><div style="color:var(--t2);font-size:10.5px">${ST.makeFail?'Red: faces past the 55° overhang limit':'Rotated 90° on X, prints without supports'}</div></div>`;}
  vp.style.background=bg||'';
  vp.innerHTML=`<svg class="scene" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${svg}</svg>${ov}${ST.toast?`<div class="ov glass" style="left:50%;bottom:${['design','generate','assemble'].includes(s)?58:14}px;transform:translateX(-50%);padding:8px 12px;border-radius:10px;font-size:12px;display:flex;gap:8px;align-items:center;max-width:620px"><span style="color:#d9a0f8">${ic('sparkles',14)}</span>${ST.toast}</div>`:''}`;
  if(anim){vp.classList.remove('fade');void vp.offsetWidth;vp.classList.add('fade');}
}
function renderSbar(){const e=ENT[ST.sel];$('#sbar').innerHTML=`<span style="display:flex;gap:5px;align-items:center">${e?`<span style="color:#7cc0ff">${ic(e.icon,12)}</span><b>${e.name}</b><span>${e.sub()}</span>`:'No selection'}</span><span style="flex:1"></span><span>${ST.running.train?`Training v18 ${pct(ST.prog.train)}`:''}</span><span class="sv"></span><span>Auto-update: Assemble, board link</span><span class="sv"></span><span>Units mm</span><span class="sv"></span><span>viaform-core (Rust) · rebuild 8 ms</span>`;}

/* ---------- popovers: dependency graph, jobs, stage hover ---------- */
const GPOS={design:[64,128],generate:[184,54],electronics:[184,202],assemble:[304,128],simulate:[424,54],render:[424,202],train:[540,54],make:[540,202]};
function edgeState(a,b){const sa=status(a),sb=status(b);if(sa==='running')return'running';if((sb==='stale'||sb==='failed')&&(a==='assemble'||sa==='stale'))return sb==='failed'?'failed':'stale';return'ok';}
function graphSVG(){const W=604,H=258;let s=`<svg width="${W}" height="${H}" style="display:block">`;
  for(const [a,b,l] of DEPS){const [x1,y1]=GPOS[a],[x2,y2]=GPOS[b];const st=edgeState(a,b);const col=st==='stale'?'#ff9f0a':st==='failed'?'#ff453a':st==='running'?'#3d9bff':'rgba(255,255,255,.28)';
    let d;const back=x2<x1||(x2===x1);
    if(back){const up=(y1<=128&&y2<=128)?-1:(y1>=128&&y2>=128?1:(a==='assemble'?1:-1));const yy=Math.min(y1,y2)+(up<0?-40:0)+(up>0?Math.max(y1,y2)-Math.min(y1,y2)+40:0);d=`M${x1},${y1+up*20}C${x1},${yy} ${x2},${yy} ${x2},${y2+up*20}`;}
    else d=`M${x1+52},${y1}C${(x1+x2)/2+10},${y1} ${(x1+x2)/2-10},${y2} ${x2-52},${y2}`;
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${st==='ok'?1.2:1.8}" ${back?'stroke-dasharray="3 3"':''} class="${st==='running'?'flowdash':''}" ${st==='running'?'stroke-dasharray="4 4"':''}/>`;}
  for(const g of STAGES){const [x,y]=GPOS[g.id],st=status(g.id),cur=g.id===ST.stage;
    s+=`<g transform="translate(${x-52},${y-19})" data-stage="${g.id}" style="cursor:default"><rect width="104" height="38" rx="9" fill="${cur?'rgba(10,132,255,.22)':'rgba(255,255,255,.07)'}" stroke="${st==='stale'?'rgba(255,159,10,.7)':st==='failed'?'rgba(255,69,58,.7)':st==='running'?'rgba(10,132,255,.7)':'rgba(255,255,255,.14)'}"/><svg x="9" y="10" width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="${cur?'#7cc0ff':'rgba(255,255,255,.75)'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IC[g.icon]}</svg><text x="32" y="17" font-size="11.5" font-weight="600" fill="#fff" font-family="-apple-system">${g.name}</text><text x="32" y="30" font-size="9.5" fill="${st==='stale'?'#ffb340':st==='failed'?'#ff6961':st==='running'?'#5eb0ff':'rgba(235,235,245,.5)'}" font-family="-apple-system">${meta(g.id)}</text><g transform="translate(92,-4)">${stBadge(st,ST.prog[g.id],13)}</g></g>`;}
  return s+'</svg>';}
function graphHTML(){const n=staleCount();const A=[[`Frame body #${ST.applied}`,'generate','Design, Assemble',`${cand(ST.applied).mass} g`,'ok'],['Mass properties','assemble','Simulate',status('simulate')==='stale'?`rev ${ST.asm}, used ${ST.used.simulate}`:`rev ${ST.asm}`,status('simulate')==='stale'?'stale':'ok'],['Board 3D','electronics','Assemble','rev C','ok'],['Policy v17','train','Simulate, Make','deployed','ok'],['Policy v18','train','Simulate',ST.running.train?pct(ST.prog.train):'stopped',ST.running.train?'running':'stale'],['Crash load 6 m/s','simulate','Generate','148 MPa','ok'],['Assembly','assemble','Render, Make',status('render')==='stale'?`rev ${ST.asm}, used ${ST.used.render}`:`rev ${ST.asm}`,status('render')==='stale'?'stale':'ok']];
  return `<div class="arrow" style="left:var(--ax)"></div><div class="ph"><span class="tt">Dependencies</span><span class="mt">${n} of 8 stages need attention</span><div style="flex:1"></div><span style="font-size:11px;color:var(--t2);display:flex;gap:6px;align-items:center">Auto-update cheap stages <span class="sw on"></span></span></div>
  <div style="padding:0 0 4px">${graphSVG()}</div>
  <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--hair)"><button class="btn sm ghost" data-act="graphX">${ic(ST.graphX?'chevD':'chevR',10)}${ST.graphX?'Hide':'Show'} artifacts</button><div style="flex:1"></div><span style="font-size:11px;color:var(--t3)">Dashed: feedback edges</span><button class="btn sm ${n?'warn':''}" data-act="updall" ${n?'':'disabled'}>${ic('refresh',11)}Update stale</button></div>
  ${ST.graphX?`<div style="padding:0 10px 10px"><table style="width:100%;font-size:11.5px;border-collapse:collapse">${A.map(([t,p,c,r,st])=>`<tr style="border-top:1px solid var(--hair)"><td style="padding:5px 4px">${t}</td><td style="color:var(--t2)">${SN[p].name} → ${c}</td><td class="num" style="color:var(--t2)">${r}</td><td align="right">${stBadge(st,ST.prog.train,12)}</td></tr>`).join('')}</table></div>`:''}`;}
function jobsHTML(){const J=[];
  if(ST.running.train)J.push(['trend','Train policy v18',`PPO + PID residual · 16 envs · episode ${ST.ep} of 3000`,ST.prog.train,'running','ETA 14 min']);
  else if(ST.trainStopped)J.push(['trend','Train policy v18',`Stopped at ${pct(ST.prog.train)}: environment changed to rev ${ST.asm}`,ST.prog.train,'stale','']);
  if(ST.running.simulate)J.push(['wind','Fly obstacle course',`Assembly rev ${ST.asm}`,ST.prog.simulate,'running','']);
  if(ST.running.render)J.push(['aperture','Render Hero 3/4 · 4K',`512 spp · rev ${ST.asm}`,ST.prog.render,'running','']);
  else if(status('render')==='stale')J.push(['aperture','Render Hero 3/4 · 4K',`Paused at 34 %: rev ${ST.used.render} is outdated`,.34,'stale','']);
  J.push(['gauge','Stress · crash 6 m/s','Queued after training · 1.2 M elements',0,'queued','']);J.push(['sparkles','Generate · camera mount study','Queued · 24 outcomes',0,'queued','']);
  const D=[['sparkles','Generate · 3-inch frame','64 outcomes · 3 min 12 s'],['gear',`Assemble rebuild rev ${ST.asm}`,'0.2 s · automatic after frame change']];
  return `<div class="arrow" style="left:var(--ax)"></div><div class="ph"><span class="tt">Jobs</span><span class="mt">This Mac · Rust core · 10 cores</span></div>${J.map(([i,t,s,p,st,eta])=>`<div class="job"><span style="color:${st==='stale'?'var(--warn)':st==='running'?'#4aa3ff':'var(--t3)'}">${ic(i,18)}</span><div class="jt"><b>${t}</b><div class="js">${s}</div>${st!=='queued'?`<div style="display:flex;align-items:center;gap:8px;margin-top:5px"><div class="pb ${st==='stale'?'warn':''}"><i style="width:${pct(p)}"></i></div><span class="num" style="font-size:10.5px;color:var(--t3)">${eta||pct(p)}</span></div>`:''}</div>${st==='running'?`<button class="tbtn" style="width:24px;height:24px">${ic('pause',12)}</button>`:st==='stale'?`<span class="tag stale">Stale</span>`:'<span class="tag">Queued</span>'}</div>`).join('')}
  <div class="flowlbl" style="padding:6px 14px 0">COMPLETED</div>${D.map(([i,t,s])=>`<div class="job" style="opacity:.8"><span style="color:var(--t3)">${ic(i,18)}</span><div class="jt"><b>${t}</b><div class="js">${s}</div></div>${stBadge('ok',0,14)}</div>`).join('')}<div style="height:6px"></div>`;}
function placePop(el,btn){const r=btn.getBoundingClientRect(),W=$('#win').getBoundingClientRect();const pw=el.offsetWidth||parseInt(el.style.width);let left=r.left+r.width/2-pw/2-W.left;left=clamp(left,10,W.width-pw-10);
  el.style.left=left+'px';el.style.top=(r.bottom-W.top+9)+'px';el.style.setProperty('--ax',(r.left+r.width/2-W.left-left-7)+'px');}
function renderPops(){const g=$('#graphPop'),j=$('#jobsPop');
  if(ST.graph){g.innerHTML=graphHTML();g.classList.add('open');placePop(g,$('#graphBtn'));}else g.classList.remove('open');
  if(ST.jobs){j.innerHTML=jobsHTML();j.classList.add('open');placePop(j,$('#jobsBtn'));}else j.classList.remove('open');}
let hovT=null;
function showHover(id,el){const F=flowOf(id),st=status(id),hv=$('#hov');const ups=DEPS.filter(d=>d[1]===id).map(d=>d[0]),downs=DEPS.filter(d=>d[0]===id).map(d=>d[1]);
  document.querySelectorAll('.stg').forEach(n=>{const sid=n.dataset.stage;n.style.boxShadow=ups.includes(sid)?'inset 0 0 0 1px rgba(10,132,255,.65)':downs.includes(sid)?'inset 0 0 0 1px rgba(255,255,255,.3)':'';});
  hv.innerHTML=`<div class="arrow" style="left:var(--ax)"></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="color:#7cc0ff">${ic(SN[id].icon,15)}</span><b style="font-size:13px">${SN[id].name}</b><span class="tag ${st}" style="margin-left:auto">${{ok:'Up to date',stale:'Stale',running:'Running',failed:'Failed'}[st]}</span></div>
  <div class="flowlbl">CONSUMES <span style="color:#4aa3ff;font-weight:500;letter-spacing:0">(blue outline)</span></div>${F.in.map(([s,t,d,x])=>`<div style="display:flex;gap:6px;align-items:center;font-size:11.5px;padding:2px 0;${x==='stale'?'color:#ffb340':''}">${ic(iconOf(s),12)}<span>${t}</span><span style="color:var(--t3);margin-left:auto;white-space:nowrap">${nameOf(s)}</span></div>`).join('')}
  <div class="flowlbl" style="margin-top:7px">PRODUCES</div>${F.out.map(([s,t,d,x])=>`<div style="display:flex;gap:6px;align-items:center;font-size:11.5px;padding:2px 0;${x==='stale'?'color:#ffb340':''}">${ic('arrowR',12)}<span>${t}</span><span style="color:var(--t3);margin-left:auto;white-space:nowrap">${nameOf(s)}</span></div>`).join('')}`;
  hv.classList.add('open');placePop(hv,el);}
function hideHover(){clearTimeout(hovT);$('#hov').classList.remove('open');document.querySelectorAll('.stg').forEach(n=>n.style.boxShadow='');}

/* ---------- actions and long jobs ---------- */
function runJob(id,dur,done){ST.running[id]=true;ST.prog[id]=0;const t0=performance.now();
  const step=()=>{const k=(performance.now()-t0)/dur;ST.prog[id]=Math.min(1,k);if(k>=1){ST.running[id]=false;done&&done();refresh(true);}else{light();if(ST.stage===id)renderVPthrottled();setTimeout(step,140);}};step();refresh(false);}
let vpT=0;function renderVPthrottled(){const n=performance.now();if(n-vpT>500){vpT=n;renderVP(false);}}
function toast(t){ST.toast=t;renderVP(false);clearTimeout(toast.t);toast.t=setTimeout(()=>{ST.toast=null;renderVP(false);},5200);}
function apply(){if(ST.pick===ST.applied)return;const prev=ST.applied;ST.applied=ST.pick;ST.rev++;
  if(ST.running.train){ST.running.train=false;ST.trainStopped=true;}
  ST.running.assemble=true;refresh(true);
  setTimeout(()=>{ST.running.assemble=false;ST.asm=ST.rev;refresh(true);toast(`Outcome #${ST.applied} replaced #${prev} in Design. Assemble rebuilt on its own; Simulate, Train, Render and Make are now stale.`);},900);}
const ACTS={
  apply,refly:()=>runJob('simulate',2600,()=>{ST.used.simulate=ST.asm;}),rerender:()=>runJob('render',4200,()=>{ST.used.render=ST.asm;}),
  fixmake:()=>runJob('make',1800,()=>{ST.makeFail=false;ST.used.make=ST.asm;}),retrain:()=>{ST.running.train=true;ST.trainStopped=false;ST.used.train=ST.asm;ST.prog.train=.02;ST.ep=36;refresh(true);},
  exploded:()=>{ST.exploded=true;refresh(true);},assembled:()=>{ST.exploded=false;refresh(true);},sch:()=>{ST.pcbMode='sch';refresh(true);},pcb:()=>{ST.pcbMode='pcb';refresh(true);},
  flight:()=>{ST.simMode='flight';refresh(true);},stress:()=>{ST.simMode='stress';refresh(true);},graphX:()=>{ST.graphX=!ST.graphX;renderPops();},
  play:()=>{ST.playing=!ST.playing;if(ST.playing)fly();renderBot();},cmp:()=>{},
  updall:()=>{const q=[];if(status('simulate')==='stale')q.push(()=>ACTS.refly());if(status('train')==='stale')q.push(()=>ACTS.retrain());if(status('render')==='stale')q.push(()=>ACTS.rerender());if(ST.makeFail)q.push(()=>ACTS.fixmake());q.forEach((f,i)=>setTimeout(f,i*400));},
};
function fly(){if(!ST.playing)return;ST.simF+=.004;if(ST.simF>=.995){ST.simF=.995;ST.playing=false;}if(ST.stage==='simulate'&&ST.simMode==='flight'){renderVP(false);renderBot();}setTimeout(fly,90);}
function go(id){if(!SN[id]||id===ST.stage)return;ST.stage=id;hideHover();refresh(true);}
function light(){renderPipe();renderTB();$('#sbArt').innerHTML=artHTML();renderSbar();if(ST.graph||ST.jobs)renderPops();}
function refresh(anim){renderPipe();renderTB();renderStageBar();renderSide();renderInsp();renderBot();renderVP(anim);renderSbar();renderPops();}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-stage],[data-ent],[data-cand],#graphBtn,#jobsBtn,#sbToggle,#inspBtn');
  if(!t){if(!e.target.closest('.popover')){ST.graph=false;ST.jobs=false;renderTB();renderPops();}return;}
  if(t.id==='graphBtn'){ST.graph=!ST.graph;ST.jobs=false;renderTB();renderPops();return;}
  if(t.id==='jobsBtn'){ST.jobs=!ST.jobs;ST.graph=false;renderTB();renderPops();return;}
  if(t.id==='sbToggle'){ST.sb=!ST.sb;$('#sbBody').style.display=$('#sbArt').style.display=$('#sbSearch').style.display=ST.sb?'':'none';$('#sb').style.width=ST.sb?'':'86px';renderVP(false);return;}
  if(t.id==='inspBtn'){ST.insp=!ST.insp;$('#insp').style.display=ST.insp?'':'none';refresh(false);return;}
  if(t.dataset.act&&ACTS[t.dataset.act]){ACTS[t.dataset.act]();return;}
  if(t.dataset.cand){ST.pick=+t.dataset.cand;refresh(false);return;}
  if(t.dataset.ent){ST.sel=t.dataset.ent;refresh(false);return;}
  if(t.dataset.stage){if(t.closest('.popover')){ST.graph=false;ST.jobs=false;}go(t.dataset.stage);renderPops();}
});
document.addEventListener('mouseover',e=>{const s=e.target.closest('.stg');if(!s)return;clearTimeout(hovT);hovT=setTimeout(()=>showHover(s.dataset.stage,s),380);});
document.addEventListener('mouseout',e=>{const s=e.target.closest('.stg');if(s&&!s.contains(e.relatedTarget))hideHover();});
document.addEventListener('keydown',e=>{const n=parseInt(e.key,10);if(n>=1&&n<=8){go(STAGES[n-1].id);e.preventDefault();}
  if(e.key==='g'||e.key==='G'){ST.graph=!ST.graph;ST.jobs=false;renderTB();renderPops();}if(e.key==='Escape'){ST.graph=ST.jobs=false;renderTB();renderPops();}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>refresh(false),120);});
setInterval(()=>{if(!ST.running.train)return;ST.prog.train=Math.min(.99,ST.prog.train+.0012);ST.ep+=1+(ST.ep%3===0?1:0);light();if(ST.stage==='train'){renderBot();}},1600);
const q=new URLSearchParams(location.search).get('stage');if(q&&SN[q])ST.stage=q;
refresh(false);
</script>
</body>
</html>
