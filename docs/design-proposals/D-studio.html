<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViaForm Split Studio</title>
<style>
:root{
  --accent:#0a84ff;--accent2:#4aa3ff;--accentA:rgba(10,132,255,.2);--accentB:rgba(10,132,255,.12);
  --orange:#ff9f0a;--orangeA:rgba(255,159,10,.16);--green:#32d74b;--greenA:rgba(50,215,75,.15);--red:#ff453a;
  --yellow:#ffd60a;--teal:#64d2ff;--purple:#bf5af2;--pink:#ff375f;
  --t1:rgba(255,255,255,.9);--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.36);--t4:rgba(235,235,245,.2);
  --sep:rgba(255,255,255,.08);--sepS:rgba(255,255,255,.05);--sepD:rgba(0,0,0,.55);
  --toolbar:#2c2c2f;--content:#1c1d20;--pane:#212226;--panel:#26272b;--field:rgba(255,255,255,.06);
  --float:rgba(38,39,44,.78);--floatB:rgba(255,255,255,.11);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0b0d}
body{font:13px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
svg text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.ic{flex:none;display:block}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* window */
.win{position:fixed;inset:0;display:flex;border-radius:11px;overflow:hidden;background:var(--content)}
.win::after{content:"";position:absolute;inset:0;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.07);pointer-events:none;z-index:50}

/* sidebar */
.sb{width:238px;flex:none;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,rgba(58,55,66,.96) 0%,rgba(44,44,50,.97) 34%,rgba(39,40,45,.98) 100%);
  border-right:1px solid rgba(0,0,0,.62);box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}
.sb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 40% at 0% 0%,rgba(110,90,160,.10),transparent 70%),radial-gradient(90% 30% at 100% 100%,rgba(40,90,140,.08),transparent 70%);pointer-events:none}
.sb-top{height:52px;flex:none;display:flex;align-items:center;padding:0 12px 0 18px;position:relative}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.28)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.sb-top .sbt{margin-left:auto;color:var(--t2);width:28px;height:24px;display:grid;place-items:center;border-radius:6px}
.sb-search{margin:0 10px 8px;height:26px;border-radius:7px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--t3);font-size:12.5px;position:relative}
.sb-search kbd{margin-left:auto;font:11px var(--mono);color:var(--t4)}
.sb-scroll{flex:1;min-height:0;overflow:hidden;position:relative}
.sb-h{font-size:11px;font-weight:600;color:var(--t3);padding:10px 20px 4px;display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.sb-h .r{margin-left:auto;font-weight:500;color:var(--t4)}
.pipe{position:relative;padding:0 10px}
.prow{position:relative;height:30px;display:flex;align-items:center;gap:9px;padding:0 8px 0 10px;border-radius:7px;font-size:13px}
.prow .pi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--accent2);position:relative;z-index:1;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.prow .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pm{color:var(--t3);font-size:12px;white-space:nowrap}
.prow .pb{margin-left:auto;display:flex;align-items:center}
.prow.sel{background:rgba(255,255,255,.11)}
.prow.sel .pi{background:var(--accent);color:#fff;box-shadow:none}
.prow:hover:not(.sel){background:rgba(255,255,255,.045)}
.pipe .rail{position:absolute;left:29px;width:1.5px;border-radius:1px}
.tree{padding:0 10px}
.trow{height:23px;display:flex;align-items:center;gap:5px;border-radius:6px;font-size:12.5px;color:var(--t1);padding-right:8px;white-space:nowrap}
.trow .tc{width:12px;color:var(--t3);display:grid;place-items:center}
.trow .ti{color:var(--t2)}
.trow .tm{color:var(--t3);font-size:11.5px}
.trow .tb{margin-left:auto;display:flex;gap:4px;align-items:center}
.trow.sel{background:var(--accentA);box-shadow:inset 0 0 0 1px rgba(10,132,255,.35)}
.trow.sel .ti{color:var(--accent2)}
.trow.dim{color:var(--t3)}
.trow b{font-weight:600}
.sb-jobs{flex:none;border-top:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:6px 10px 12px;background:rgba(0,0,0,.08)}
.job{display:grid;grid-template-columns:20px 1fr auto;column-gap:8px;row-gap:3px;align-items:center;padding:5px 6px;border-radius:6px}
.job .jn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .jp{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.job .jbar{grid-column:2/4;height:3px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.job .jbar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.job .jd{grid-column:2/4;font-size:10.5px;color:var(--t3)}

/* badges and chips */
.bd{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;line-height:15px;white-space:nowrap;letter-spacing:.01em}
.bd.stale{color:#ffb340;background:var(--orangeA);box-shadow:inset 0 0 0 .5px rgba(255,159,10,.35)}
.bd.run{color:var(--accent2);background:var(--accentB)}
.bd.push{color:#fff;background:var(--accent)}
.bd.ok{color:#5be07a;background:var(--greenA)}
.bd.mut{color:var(--t2);background:rgba(255,255,255,.07)}
.bd.link{color:var(--accent2);background:transparent;box-shadow:inset 0 0 0 .5px rgba(10,132,255,.5)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.dot.o{background:var(--orange)}.dot.b{background:var(--accent)}.dot.g{background:var(--green)}.dot.m{background:var(--t3)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;white-space:nowrap;
  background:var(--float);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 0 0 .5px var(--floatB),0 2px 8px rgba(0,0,0,.25);color:var(--t1)}
.chip .ic{color:var(--t2)}
.chip.st{box-shadow:inset 0 0 0 .5px rgba(255,159,10,.55),0 2px 8px rgba(0,0,0,.25)}
.chip.st .ic{color:var(--orange)}
.chip.ln .ic{color:var(--accent2)}
.chip .sub{color:var(--t3)}

/* main + toolbar */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:52px;flex:none;display:flex;align-items:center;padding:0 10px 0 16px;background:var(--toolbar);border-bottom:1px solid rgba(0,0,0,.7);box-shadow:0 1px 0 rgba(255,255,255,.03);position:relative;z-index:5}
.tb-title{width:178px;flex:none;line-height:1.15}
.tb-title .t1{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.tb-title .t2{font-size:11px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{height:28px;min-width:30px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--t2)}
.tbtn:hover{background:rgba(255,255,255,.07)}
.tbtn.on{color:var(--accent2)}
.modes{margin:0 auto;display:flex;height:30px;padding:2px;border-radius:8px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07),inset 0 1px 2px rgba(0,0,0,.25)}
.mode{position:relative;display:flex;align-items:center;gap:6px;padding:0 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--t2);white-space:nowrap}
.mode .ic{color:var(--t2)}
.mode+.mode::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:rgba(255,255,255,.07)}
.mode.sel{background:linear-gradient(#5a5b61,#4e4f55);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.18)}
.mode.sel::before,.mode.sel+.mode::before{display:none}
.mode.sel .ic{color:var(--accent2)}
.mode .md{position:absolute;top:4px;left:21px;width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1.5px #2c2c2f}
.mode.sel .md{box-shadow:0 0 0 1.5px #55565c}
.tb-right{display:flex;align-items:center;gap:2px;width:250px;justify-content:flex-end;flex:none}
.tb-sep{width:1px;height:20px;background:var(--sep);margin:0 4px}
.jobsbtn{gap:6px;padding:0 9px;font-size:12px;color:var(--t1);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}

/* split */
.split{flex:1;min-height:0;display:flex;position:relative}
.vp{flex:1;min-width:0;position:relative;overflow:hidden;background:linear-gradient(180deg,#464a52 0%,#30333a 46%,#202226 100%)}
.vp>svg{position:absolute;inset:0;display:block}
.divider{width:1px;flex:none;background:#000;position:relative;z-index:4;box-shadow:1px 0 0 rgba(255,255,255,.05)}
.divider .grip{position:absolute;left:-2px;top:50%;width:5px;height:34px;margin-top:-17px;border-radius:3px;background:rgba(255,255,255,.2);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.divider .lk{position:absolute;left:-12px;top:10px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#24262b;color:var(--accent2);box-shadow:0 0 0 1px rgba(10,132,255,.55),0 2px 6px rgba(0,0,0,.5)}
.pane{width:552px;flex:none;display:flex;flex-direction:column;background:var(--pane);min-height:0;position:relative}
.probe{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}

/* pane header */
.ph{height:38px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid var(--sepD);background:#25262a}
.seg{display:flex;height:22px;padding:1px;border-radius:6px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07)}
.seg b{font-weight:500;font-size:11.5px;padding:0 10px;display:flex;align-items:center;border-radius:5px;color:var(--t2);white-space:nowrap}
.seg b.sel{background:linear-gradient(#5a5b61,#4f5056);color:#fff;box-shadow:0 1px 1.5px rgba(0,0,0,.35)}
.seg b.click{cursor:pointer}
.ph .pt{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ph .pt b{color:var(--t1);font-weight:600}
.ph .pa{margin-left:auto;display:flex;gap:1px;color:var(--t2)}
.ph .pa .tbtn{height:24px;min-width:26px}

/* ribbon (dense, grouped) */
.rb{height:64px;flex:none;display:flex;align-items:stretch;padding:0 4px;background:#232428;border-bottom:1px solid var(--sepD);overflow:hidden}
.grp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 6px 4px;position:relative}
.grp+.grp::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--sep)}
.grp .gi{display:flex;gap:1px;align-items:center;height:34px}
.rbb{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--t1);position:relative}
.rbb:hover{background:rgba(255,255,255,.07)}
.rbb.on{background:var(--accent);color:#fff}
.rbb.big{width:auto;padding:0 8px;display:flex;gap:6px;font-size:11.5px;font-weight:500}
.rbb.pri{background:var(--accent);color:#fff}
.rbb.go{color:var(--green)}
.rbb .rbd{position:absolute;top:2px;right:2px;min-width:12px;height:12px;border-radius:6px;background:var(--orange);color:#1c1d20;font-size:8.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.grp .gl{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--t3);display:flex;align-items:center;gap:2px;white-space:nowrap}
.pop-btn{height:24px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;font-size:11.5px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),0 .5px 1px rgba(0,0,0,.4);white-space:nowrap}
.pop-btn .ud{display:grid;place-items:center;width:14px;height:16px;border-radius:4px;background:var(--accent);color:#fff}

/* pane canvas + properties */
.pc{flex:1;min-height:0;position:relative;overflow:hidden}
.pp{height:282px;flex:none;border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);background:#1e1f22;display:flex;flex-direction:column}
.pp-h{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--sepS)}
.pp-h .ic{color:var(--accent2)}
.pp-h .s{color:var(--t3);font-weight:500;font-size:11.5px}
.pp-h .ha{margin-left:auto;display:flex;gap:6px;align-items:center}
.pp-b{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;column-gap:0}
.pcol{min-width:0;padding:2px 0 6px}
.pcol+.pcol{border-left:1px solid var(--sepS)}
.pg{font-size:11px;font-weight:600;color:var(--t2);height:22px;display:flex;align-items:center;gap:4px;padding:0 10px 0 6px;margin-top:2px}
.pg .ic{color:var(--t3)}
.pr{display:grid;grid-template-columns:44% 56%;align-items:center;min-height:21px;font-size:11.5px;padding:0 10px 0 22px}
.pr .k{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pr .v .u{color:var(--t3)}
.fld{height:19px;padding:0 6px;border-radius:4px;background:var(--field);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09);display:inline-flex;align-items:center;gap:4px;min-width:64px}
.fld.ed{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px rgba(10,132,255,.22)}
.fld.pop::after{content:"";margin-left:auto;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid var(--t2)}
.lrow{display:flex;align-items:center;gap:7px;min-height:22px;font-size:11.5px;padding:0 10px 0 22px;white-space:nowrap}
.lrow .ic{color:var(--t2)}
.lrow .x{margin-left:auto;display:flex;gap:5px;align-items:center}
.lrow .s{color:var(--t3)}
.btn{height:22px;padding:0 10px;border-radius:6px;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);box-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 .5px 1.5px rgba(0,0,0,.45);color:var(--t1);white-space:nowrap}
.btn.pri{background:linear-gradient(#2a91ff,#0a7cf5);color:#fff}
.btn.sm{height:20px;padding:0 8px;font-size:11px}
.btns{display:flex;gap:6px;padding:6px 10px 0 22px}
.tog{width:26px;height:15px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:1.5px;top:1.5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.tog.off{background:rgba(255,255,255,.16)}.tog.off::after{right:auto;left:1.5px}
.cbx{width:13px;height:13px;border-radius:3.5px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}

/* floating chrome over the 3D view */
.fl{position:absolute;background:var(--float);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 0 0 .5px var(--floatB),0 8px 24px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3)}
.trail{left:12px;top:50%;transform:translateY(-50%);width:42px;border-radius:13px;padding:5px;display:flex;flex-direction:column;gap:2px}
.trail .rbb{width:32px;height:32px;border-radius:9px;color:var(--t1)}
.trail .rs{height:1px;background:var(--sep);margin:3px 4px}
.inputs{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:62%;align-items:center}
.inputs .lab{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.05em;text-transform:uppercase;margin-right:2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:46px;border-radius:10px;padding:7px 8px 7px 12px;display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.banner .ic{color:var(--orange)}
.banner.info .ic{color:var(--accent2)}
.banner .s{color:var(--t2)}
.bot{left:50%;transform:translateX(-50%);bottom:14px;border-radius:12px;height:40px;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:12px;white-space:nowrap}
.bot .rbb{width:28px;height:28px;border-radius:7px}
.bot .vs{width:1px;height:20px;background:var(--sep);margin:0 4px}
.bot .tl{display:flex;gap:2px;align-items:center}
.bot .ft{width:28px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--t1);background:rgba(10,132,255,.13);position:relative}
.bot .ft.ro{opacity:.4;background:transparent}
.bot .ft.sel{background:var(--accent);color:#fff}
.bot .ft.lk{background:rgba(10,132,255,.13);box-shadow:inset 0 0 0 1px rgba(10,132,255,.55)}
.bot .mk{width:3px;height:28px;border-radius:2px;background:var(--orange);margin:0 2px}
.bot .scrub{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.bot .scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.bot .scrub u{position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.bot .scrub s{position:absolute;top:-3px;width:1.5px;height:10px;background:rgba(255,255,255,.45)}
.bot .tm{font-variant-numeric:tabular-nums;color:var(--t2);font-size:11.5px}
.nav{right:12px;bottom:14px;border-radius:10px;height:34px;display:flex;align-items:center;padding:0 3px;gap:0}
.nav .rbb{width:28px;height:28px;color:var(--t2)}
.cube{position:absolute;right:10px;top:8px;width:96px;height:96px}
.triad{position:absolute;left:14px;bottom:12px;width:64px;height:64px}
.ctx{position:absolute;border-radius:12px;height:36px;display:flex;align-items:center;gap:2px;padding:0 4px;font-size:12px;white-space:nowrap}
.ctx .ci{height:28px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:8px}
.ctx .ci:hover{background:rgba(255,255,255,.08)}
.ctx .ci .ic{color:var(--t1)}
.ctx .ci.pri{background:var(--accent);color:#fff}
.ctx .cs{width:1px;height:18px;background:var(--sep);margin:0 2px}
.val{position:absolute;height:24px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 3px rgba(10,132,255,.25);font-variant-numeric:tabular-nums}
.val .u{font-weight:500;opacity:.8}
.tag{position:absolute;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:5px;background:rgba(22,23,26,.82);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.3);color:var(--t1)}
.tag .s{font-weight:500;color:var(--t2)}
.tag.acc{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tag.acc .s{color:rgba(255,255,255,.8)}
.tag.or{box-shadow:inset 0 0 0 1px rgba(255,159,10,.6),0 2px 8px rgba(0,0,0,.3)}
.tag.gr{box-shadow:inset 0 0 0 1px rgba(50,215,75,.6),0 2px 8px rgba(0,0,0,.3)}
.tag.rd{box-shadow:inset 0 0 0 1px rgba(255,69,58,.65),0 2px 8px rgba(0,0,0,.3)}
.hud{position:absolute;border-radius:10px;padding:8px 10px;font-size:11.5px;min-width:170px}
.hud .hr{display:flex;justify-content:space-between;gap:16px;line-height:19px;font-variant-numeric:tabular-nums}
.hud .hr span:first-child{color:var(--t2)}

/* lists in the pane */
.flt{display:flex;gap:6px;align-items:center;padding:9px 12px 8px;font-size:11.5px;flex-wrap:nowrap}
.flt .pill{height:22px;border-radius:11px;padding:0 9px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);color:var(--t1);white-space:nowrap}
.flt .pill .k{color:var(--t3)}
.flt .r{margin-left:auto;color:var(--t3);white-space:nowrap}
.ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}
.otile{border-radius:8px;background:linear-gradient(180deg,#2c2e33,#25272b);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);overflow:hidden;position:relative}
.otile svg{display:block}
.otile .ol{display:flex;justify-content:space-between;align-items:center;padding:4px 7px 5px;font-size:10.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.otile .ol b{color:var(--t1);font-weight:600;font-size:11px}
.otile .ob{position:absolute;top:5px;left:5px;display:flex;gap:3px}
.otile .ob .bd{font-size:9.5px;padding:0 5px;line-height:14px}
.otile.sel{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 3px rgba(10,132,255,.22)}
.otile.gen{background:repeating-linear-gradient(135deg,#25272b 0 8px,#282a2f 8px 16px)}
.sech{font-size:11px;font-weight:600;color:var(--t2);padding:10px 12px 6px;display:flex;align-items:center;gap:6px}
.sech .r{margin-left:auto;font-weight:500;color:var(--t3)}
table.dt{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
table.dt th{font-weight:500;color:var(--t3);text-align:left;height:22px;padding:0 8px;border-bottom:1px solid var(--sep);font-size:10.5px;white-space:nowrap}
table.dt td{height:23px;padding:0 8px;border-bottom:1px solid var(--sepS);white-space:nowrap}
table.dt tr:nth-child(even) td{background:rgba(255,255,255,.018)}
table.dt tr.sel td{background:var(--accent);color:#fff}
table.dt tr.sel td .s{color:rgba(255,255,255,.75)}
table.dt td .s{color:var(--t3)}
table.dt td.r,table.dt th.r{text-align:right}
.qrow{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--sepS)}
.qrow .qt{width:92px;height:52px;border-radius:5px;overflow:hidden;background:#141518;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.qrow .qn{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.qrow .qs{font-size:11px;color:var(--t3);margin-top:2px}
.qrow .qb{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden;width:220px}
.qrow .qb i{display:block;height:100%;background:var(--accent)}
.qrow .qx{font-size:11px;color:var(--t2);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.qrow.sel{background:rgba(10,132,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.sw{display:flex;gap:10px;padding:4px 12px}
.swi{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--t2);width:70px;text-align:center;line-height:1.2}
.swi i{width:46px;height:46px;border-radius:50%;display:block;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.swi.sel i{box-shadow:0 0 0 2px #1e1f22,0 0 0 4px var(--accent),0 3px 8px rgba(0,0,0,.45)}
.swi.sel{color:var(--t1)}

/* popover */
.pop{position:absolute;right:178px;top:48px;width:330px;border-radius:12px;padding:6px;z-index:60;display:none;
  background:rgba(44,45,50,.9);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.55)}
.pop.on{display:block}
.pop::before{content:"";position:absolute;top:-7px;right:56px;width:14px;height:14px;transform:rotate(45deg);background:rgba(44,45,50,.95);box-shadow:-.5px -.5px 0 rgba(255,255,255,.14)}
.pop h4{font-size:12px;font-weight:600;padding:6px 8px 4px;display:flex}
.pop h4 span{margin-left:auto;color:var(--t3);font-weight:500}

.caption{position:fixed;right:14px;bottom:12px;z-index:70;max-width:420px;padding:7px 11px 8px;border-radius:9px;background:rgba(12,12,14,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);font-size:11px;line-height:1.35;color:var(--t2);pointer-events:none}
.caption b{color:#fff;font-weight:600;margin-right:6px}

function ic(n,s=16,extra=''){return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[n]||''}</svg>`}
function ring(p,s=14,c='var(--accent)'){const r=(s-3)/2,C=2*Math.PI*r;return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="${(C*p).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${s/2} ${s/2})" stroke-linecap="round"/></svg>`}

/* ================================================================== tiny 3D engine: orthographic, flat shaded, SVG out */
const D2R=Math.PI/180;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const I3=[[1,0,0],[0,1,0],[0,0,1]];
const mAp=(M,v)=>[M[0][0]*v[0]+M[1][0]*v[1]+M[2][0]*v[2],M[0][1]*v[0]+M[1][1]*v[1]+M[2][1]*v[2],M[0][2]*v[0]+M[1][2]*v[1]+M[2][2]*v[2]];
const mMul=(A,B)=>B.map(c=>mAp(A,c));
const rotZ=a=>{const c=Math.cos(a),s=Math.sin(a);return [[c,s,0],[-s,c,0],[0,0,1]]};
const rotX=a=>{const c=Math.cos(a),s=Math.sin(a);return [[1,0,0],[0,c,s],[0,-s,c]]};
const rotY=a=>{const c=Math.cos(a),s=Math.sin(a);return [[c,0,-s],[0,1,0],[s,0,c]]};
const scl=(x,y=x,z=x)=>[[x,0,0],[0,y,0],[0,0,z]];
function camera(yaw,elev,s,cx,cy){
  const t=yaw*D2R,e=elev*D2R,ct=Math.cos(t),st=Math.sin(t),ce=Math.cos(e),se=Math.sin(e);
  const dir=p=>{const xr=p[0]*ct-p[1]*st,yr=p[0]*st+p[1]*ct,z=p[2];return [xr,z*ce+yr*se,z*se-yr*ce]};
  return {dir,s,cx,cy,yaw,elev,proj:p=>{const c=dir(p);return [cx+c[0]*s,cy-c[1]*s,c[2]]}};
}
const LIGHT=nrm([-.48,.78,.42]),HALF=nrm([LIGHT[0],LIGHT[1],LIGHT[2]+1]),FILL=nrm([.75,-.15,.6]);
function shade(m,n){
  const c=m.color,d=Math.max(0,dot(n,LIGHT)),s=Math.pow(Math.max(0,dot(n,HALF)),m.shin||20)*(m.spec??.1),f=Math.max(0,dot(n,FILL))*(m.fill??.16);
  const k=(m.amb??.36)+(m.dif??.66)*d+f;
  return 'rgb('+Math.min(255,Math.round(c[0]*k+255*s))+','+Math.min(255,Math.round(c[1]*k+255*s))+','+Math.min(255,Math.round(c[2]*k+255*s))+')';
}
const f1=v=>Math.round(v*10)/10;
const p2=pts=>'M'+pts.map(q=>f1(q[0])+','+f1(q[1])).join('L')+'Z';
const pl=pts=>'M'+pts.map(q=>f1(q[0])+','+f1(q[1])).join('L');
/* 2D polygon helpers (mm) */
function circ(cx,cy,r,n=28,a0=0){const p=[];for(let i=0;i<n;i++){const a=a0+i/n*Math.PI*2;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return p}
function rrect(cx,cy,w,h,r,n=5){r=Math.min(r,w/2,h/2);const p=[],c=[[cx+w/2-r,cy-h/2+r,-90],[cx+w/2-r,cy+h/2-r,0],[cx-w/2+r,cy+h/2-r,90],[cx-w/2+r,cy-h/2+r,180]];for(const [x,y,a0] of c)for(let i=0;i<=n;i++){const a=(a0+i/n*90)*D2R;p.push([x+r*Math.cos(a),y+r*Math.sin(a)])}return p}
function rect(cx,cy,w,h){return [[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]]}
function stadium(a,b,w,n=8){const dx=b[0]-a[0],dy=b[1]-a[1],an=Math.atan2(dy,dx),p=[];for(let i=0;i<=n;i++){const t=an-Math.PI/2+i/n*Math.PI;p.push([b[0]+w/2*Math.cos(t),b[1]+w/2*Math.sin(t)])}for(let i=0;i<=n;i++){const t=an+Math.PI/2+i/n*Math.PI;p.push([a[0]+w/2*Math.cos(t),a[1]+w/2*Math.sin(t)])}return p}
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2}
const ccw=p=>area(p)<0?p.slice().reverse():p, cw=p=>area(p)>0?p.slice().reverse():p;
function rot2(P,a,cx=0,cy=0){const c=Math.cos(a),s=Math.sin(a);return P.map(([x,y])=>[cx+x*c-y*s,cy+x*s+y*c])}
function tr2(P,dx,dy){return P.map(([x,y])=>[x+dx,y+dy])}
function bez(a,c,b,t){const u=1-t;return [u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]]}
function beam(a,c,b,wa,wb,n=12){const L=[],R=[];for(let i=0;i<=n;i++){const t=i/n,P=bez(a,c,b,t),T=[2*(1-t)*(c[0]-a[0])+2*t*(b[0]-c[0]),2*(1-t)*(c[1]-a[1])+2*t*(b[1]-c[1])],l=Math.hypot(T[0],T[1])||1,N=[-T[1]/l,T[0]/l],w=(wa+(wb-wa)*t)/2*(1+.18*Math.sin(Math.PI*t));L.push([P[0]+N[0]*w,P[1]+N[1]*w]);R.push([P[0]-N[0]*w,P[1]-N[1]*w])}return ccw(R.concat(L.reverse()))}

/* emit a union of prisms: hidden-cap outline, walls (painter sorted), cap outline, cap fill */
function emitUnion(ms,cam,u){
  let hid='',capO='',capF='';const walls=[];const ew=u.ew??1.5;
  for(const m of ms){
    const mat=m.mat||u.mat,M=m.M||I3,T=m.T||[0,0,0];
    const W=p=>{const l=mAp(M,p);return [l[0]+T[0],l[1]+T[1],l[2]+T[2]]};
    const rings=[{p:ccw(m.outer),sm:m.smooth??false}];(m.holes||[]).forEach(h=>rings.push({p:cw(h),sm:true}));
    for(const r of rings){
      const P=r.p,n=P.length;r.top=P.map(q=>cam.proj(W([q[0],q[1],m.z1])));r.bot=P.map(q=>cam.proj(W([q[0],q[1],m.z0])));
      if(m.noWalls)continue;
      for(let i=0;i<n;i++){const j=(i+1)%n,a=P[i],b=P[j];
        const nl=nrm(cam.dir(mAp(M,[b[1]-a[1],-(b[0]-a[0]),0])));if(nl[2]<=.002)continue;
        const q=[r.bot[i],r.bot[j],r.top[j],r.top[i]];
        walls.push({d:(q[0][2]+q[1][2]+q[2][2]+q[3][2])/4,path:p2(q),fill:m.wallFill||shade(mat,nl),sm:r.sm,edge:mat.edge});
      }
    }
    const nT=nrm(cam.dir(mAp(M,[0,0,1])));const vis=nT[2]>.002?'top':nT[2]<-.002?'bot':null;const hk=vis==='top'?'bot':'top';
    if(mat.edge&&!m.noHid)hid+=`<path d="${rings.map(r=>p2(r[hk])).join('')}" fill="none" stroke="${mat.edge}" stroke-width="${ew}" stroke-linejoin="round"/>`;
    if(vis){
      const nv=vis==='top'?nT:[-nT[0],-nT[1],-nT[2]];const path=rings.map(r=>p2(r[vis])).join('');
      if(mat.edge||m.edgeSel)capO+=`<path d="${path}" fill="none" stroke="${m.edgeSel||mat.edge}" stroke-width="${m.edgeSel?ew*1.9:ew}" stroke-linejoin="round"/>`;
      capF+=`<path d="${path}" fill="${m.capFill||shade(mat,nv)}" fill-rule="evenodd"${m.capOp?` fill-opacity="${m.capOp}"`:''}/>`;
      if(mat.pattern)capF+=`<path d="${path}" fill="${mat.pattern}" fill-rule="evenodd"/>`;
      if(mat.sheen)capF+=`<path d="${path}" fill="${mat.sheen}" fill-rule="evenodd"/>`;
    }
  }
  walls.sort((a,b)=>a.d-b.d);
  let ws='';for(const w of walls)ws+=`<path d="${w.path}" fill="${w.fill}" stroke="${w.sm||!w.edge?w.fill:'rgba(0,0,0,.42)'}" stroke-width=".6" stroke-linejoin="round"/>`;
  const op=u.op??1;
  return `<g${op<1?` opacity="${op}"`:''}${u.filter?` filter="${u.filter}"`:''}>${hid}${ws}${capO}${capF}</g>`;
}
function emitMesh(o,cam){
  const fs=[];for(const f of o.faces){const n=nrm(cam.dir(f.n));if(n[2]<=.002)continue;const q=f.pts.map(p=>cam.proj(p));fs.push({d:q.reduce((s,v)=>s+v[2],0)/q.length,path:p2(q),fill:shade(o.mat,n)})}

function paneSchematic(w,h){
  let s=`<svg width="${w}" height="${h}" style="display:block;background:#141518">`;
  for(let x=10;x<w;x+=12)for(let y=10;y<h;y+=12)s+=`<circle cx="${x}" cy="${y}" r=".6" fill="rgba(255,255,255,.12)"/>`;
  s+=`<rect x="10" y="10" width="${w-20}" height="${h-20}" fill="none" stroke="rgba(255,255,255,.18)"/>`;
  const sym=(x,y,ww,hh,ref,val,pinsL,pinsR,sel)=>{let t=`<g transform="translate(${x} ${y})"><rect width="${ww}" height="${hh}" fill="${sel?'rgba(10,132,255,.14)':'rgba(255,214,10,.04)'}" stroke="${sel?'#0a84ff':'#c9a227'}" stroke-width="${sel?2:1.2}" ${sel?'id="pa"':''}/><text x="0" y="-6" font-size="11" font-weight="600" fill="${sel?'#4aa3ff':'#e6e6e6'}">${ref}</text><text x="${ww}" y="-6" font-size="10" fill="rgba(235,235,245,.5)" text-anchor="end">${val}</text>`;
    pinsL.forEach((p,i)=>{const py=18+i*18;t+=`<path d="M-18,${py}H0" stroke="#c9a227"/><text x="5" y="${py+3.5}" font-size="9.5" fill="rgba(235,235,245,.75)">${p}</text>`});
    pinsR.forEach((p,i)=>{const py=18+i*18;t+=`<path d="M${ww},${py}H${ww+18}" stroke="#c9a227"/><text x="${ww-5}" y="${py+3.5}" font-size="9.5" fill="rgba(235,235,245,.75)" text-anchor="end">${p}</text>`});return t+'</g>'};
  const ux=w*.12,uy=60;
  s+=sym(ux,uy,120,190,'U1','MCU',['PA5 SCK','PA6 MISO','PA7 MOSI','PA4 CS','PC4 INT','PB6 SCL','PB7 SDA','PA9 TX'],[],false);
  s+=sym(w*.62,uy+10,110,130,'U2','IMU 6 axis',['SCLK','SDO','SDI','CS','INT1','VDD'],[],true);
  s+=sym(w*.62,uy+200,100,94,'U3','Baro',['SCL','SDA','VDD','GND'],[],false);
  const G='#32d74b';let wires='';
  ['SPI1_SCK','SPI1_MISO','SPI1_MOSI','IMU_CS','IMU_INT'].forEach((n,i)=>{const y1=uy+18+i*18,y2=uy+10+18+i*18;const x1=ux+120,x2=w*.62-18;wires+=`<path d="M${x1},${y1}H${(x1+x2)/2}V${y2}H${x2}" fill="none" stroke="${G}" stroke-width="1.2"/><circle cx="${x2}" cy="${y2}" r="2" fill="${G}"/><text x="${(x1+x2)/2+6}" y="${y1-3}" font-size="9" fill="${G}">${n}</text>`});
  ['I2C_SCL','I2C_SDA'].forEach((n,i)=>{const y1=uy+18+(5+i)*18,y2=uy+200+18+i*18,x1=ux+120,x2=w*.62-18;wires+=`<path d="M${x1},${y1}H${(x1+x2)/2-20+i*8}V${y2}H${x2}" fill="none" stroke="${G}" stroke-width="1.2"/><text x="${x2-60}" y="${y2-3}" font-size="9" fill="${G}">${n}</text>`});
  s+=wires;
  // power symbols
  const pw=(x,y,t)=>`<g transform="translate(${x} ${y})"><path d="M0,0V-10M-7,-10H7" stroke="#ff453a" stroke-width="1.4"/><text x="0" y="-14" font-size="9.5" fill="#ff6b61" text-anchor="middle">${t}</text></g>`;
  s+=pw(w*.62-18,uy+10+18+5*18,'3V3')+`<path d="M${w*.62-18},${uy+10+18+5*18}H${w*.62}" stroke="#c9a227"/>`;
  s+=`<g transform="translate(${w-200} ${h-62})"><rect width="188" height="50" fill="none" stroke="rgba(255,255,255,.25)"/><path d="M0,18H188M110,18V50" stroke="rgba(255,255,255,.18)"/><text x="6" y="13" font-size="10" fill="rgba(235,235,245,.75)" font-weight="600">IMU and baro</text><text x="6" y="31" font-size="9" fill="rgba(235,235,245,.5)">Hawk 3 FC</text><text x="6" y="44" font-size="9" fill="rgba(235,235,245,.5)">Sheet 3 of 4</text><text x="116" y="31" font-size="9" fill="rgba(235,235,245,.5)">Rev 8</text><text x="116" y="44" font-size="9" fill="rgba(235,235,245,.5)">ViaForm</text></g>`;
  return s+'</svg>';
}

  faces.forEach(f=>{const nn=nrm(cam.dir(f.n));if(nn[2]<=0)return;const u=f.u,v=f.v,o=f.o;
    const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>R([o[0]+u[0]*a+v[0]*b,o[1]+u[1]*a+v[1]*b,o[2]+u[2]*a+v[2]*b]));
    const sh=shade({color:[118,124,136],amb:.55,dif:.45,spec:.05},nn);

  return out+`<g transform="translate(4 2) scale(.62)" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC.home}</g></svg>`;

function triad(cam){const c=[22,40];let s=`<svg class="triad" viewBox="0 0 64 64">`;
  [[[1,0,0],'#ff5f57','X'],[[0,1,0],'#32d74b','Y'],[[0,0,1],'#0a84ff','Z']].map(a=>{const q=cam.dir(a[0]);return {q,a}}).sort((A,B)=>A.q[2]-B.q[2]).forEach(({q,a})=>{const x=c[0]+q[0]*20,y=c[1]-q[1]*20;s+=`<path d="M${c[0]},${c[1]}L${f1(x)},${f1(y)}" stroke="${a[1]}" stroke-width="2.2" stroke-linecap="round"/><circle cx="${f1(x)}" cy="${f1(y)}" r="5.6" fill="${a[1]}"/><text x="${f1(x)}" y="${f1(y+2.6)}" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">${a[2]}</text>`});
  return s+`<circle cx="${c[0]}" cy="${c[1]}" r="2" fill="#ddd"/></svg>`}
const DEFS=`<defs><filter id="b3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter><filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter><filter id="b6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter><filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter><filter id="b10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>

<pattern id="twill" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="6" height="6" fill="rgba(0,0,0,0)"/><path d="M0,1.5H3M3,4.5H6" stroke="rgba(255,255,255,.07)" stroke-width="1.4"/><path d="M1.5,3V6M4.5,0V3" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/></pattern>
<linearGradient id="reflG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4049" stop-opacity=".95"/><stop offset="1" stop-color="#3b4049" stop-opacity="0"/></linearGradient>
<radialGradient id="studio" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#3c3f46"/><stop offset=".55" stop-color="#1c1d21"/><stop offset="1" stop-color="#0b0b0d"/></radialGradient>
<radialGradient id="key" cx=".3" cy="0" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;

/* ================================================================== controller */
let cur='electronics',alt=false,jobsOpen=false;
const $=id=>document.getElementById(id);
function renderChrome(){
  $('sbt').innerHTML=ic('sidebarL',17);
  $('sbsearch').innerHTML=ic('search',13)+'Filter<kbd>⌘F</kbd>';
  $('tbr').innerHTML=`<span class="tbtn jobsbtn" id="jobsBtn">${ring(.52,15)}<span class="num">3 jobs</span></span><span class="tb-sep"></span><span class="tbtn on" title="Linked selection">${ic('link',17)}</span><span class="tbtn" title="Layout">${ic('split',17)}${ic('chevD',10)}</span><span class="tbtn">${ic('share',17)}</span><span class="tbtn">${ic('sidebarR',17)}</span>`;
  $('lk').innerHTML=ic('link',13);
  $('jobsBtn').onclick=e=>{e.stopPropagation();jobsOpen=!jobsOpen;$('jobsPop').classList.toggle('on',jobsOpen)};
  document.addEventListener('click',()=>{if(jobsOpen){jobsOpen=false;$('jobsPop').classList.remove('on')}});
  $('jobsPop').innerHTML=`<h4>Activity<span>3 running · Apple GPU</span></h4>`+JOBS.map(j=>`<div class="job">${ic(j.i,16,'style="color:var(--accent2)"')}<span class="jn">${j.n}</span><span class="jp">${j.r}</span><span class="jbar"><i style="width:${j.p*100}%"></i></span><span class="jd">${j.d}</span></div>`).join('')+`<div style="border-top:1px solid var(--sep);margin:6px 2px 0;padding:8px 6px 4px;font-size:11.5px;color:var(--t2);display:flex;gap:6px;align-items:center">${ic('clock',13)}Done today: Exploded view, Top view, Run 12<span style="margin-left:auto;color:var(--accent2)">Show all</span></div>`;
}
function renderSidebar(){
  const ix=PIPE.findIndex(p=>p.id===cur);
  let s='';PIPE.forEach((p,i)=>{s+=`<div class="prow ${p.id===cur?'sel':''}" data-m="${p.id}"><span class="pi">${ic(p.icon,13)}</span><span class="pn">${p.n}</span>${p.m?`<span class="pm">${p.m}</span>`:''}<span class="pb">${p.b}</span></div>`});
  // rail segments between icons: orange where staleness flows downstream
  let rails='';PIPE.forEach((p,i)=>{if(i===PIPE.length-1)return;const top=i*30+25,hgt=10;const st=STALE_RAIL[PIPE[i+1].id];rails+=`<span class="rail" style="top:${top}px;height:${hgt}px;background:${st?'rgba(255,159,10,.6)':'rgba(255,255,255,.14)'}"></span>`});
  $('pipe').innerHTML=rails+s;
  $('pipe').querySelectorAll('.prow').forEach(el=>el.onclick=()=>setMode(el.dataset.m));
  $('treeH').innerHTML=ST[cur].treeH+`<span class="r">${MODES.find(m=>m.id===cur).label}</span>`;
  $('tree').innerHTML=ST[cur].tree;
  $('jobs').innerHTML=`<div class="sb-h" style="padding:6px 10px 4px">Activity<span class="r">3 running</span></div>`+JOBS.map(j=>`<div class="job">${ic(j.i,15,'style="color:var(--accent2)"')}<span class="jn">${j.n}</span><span class="jp">${j.r}</span><span class="jbar"><i style="width:${j.p*100}%"></i></span></div>`).join('');
}
function renderToolbar(){
  $('subtitle').textContent=ST[cur].sub;
  $('modes').innerHTML=MODES.map(m=>`<span class="mode ${m.id===cur?'sel':''}" data-m="${m.id}">${ic(m.icon,15)}${m.dot?`<span class="md" style="background:${m.dot==='o'?'var(--orange)':'var(--accent)'}"></span>`:''}${m.label}</span>`).join('');
  $('modes').querySelectorAll('.mode').forEach(el=>el.onclick=()=>setMode(el.dataset.m));
}
function renderPane(){
  const st=ST[cur],p=st.pane,useAlt=alt&&st.alt;
  const selIx=useAlt?0:p.sel;
  $('ph').innerHTML=`<span class="seg">${p.seg.map((t,i)=>`<b class="${i===selIx?'sel':''} ${p.click&&p.click.includes(i)?'click':''}" data-i="${i}">${t}</b>`).join('')}</span><span class="pt">${useAlt?st.alt.title:p.title}</span><span class="pa"><span class="tbtn on" title="Linked to 3D">${ic('link',14)}</span><span class="tbtn">${ic('popout',14)}</span><span class="tbtn">${ic('ellipsis',14)}</span></span>`;
  $('ph').querySelectorAll('.seg b.click').forEach(b=>b.onclick=()=>{alt=(+b.dataset.i===0);renderPane();requestAnimationFrame(drawProbe)});
  $('rb').innerHTML=ribbon(p.ribbon);
  const pc=$('pc');const w=pc.clientWidth,h=pc.clientHeight;
  pc.innerHTML=(useAlt?st.alt.canvas:p.canvas)(w,h);
  $('pp').innerHTML=st.props();
}
let lastScene=null;
function renderViewport(){
  const vp=$('vp'),W=vp.clientWidth,H=vp.clientHeight;
  const S=SCENES[cur](W,H);S.W=W;S.H=H;lastScene=S;
  let bg='';
  if(S.bg==='render')bg=`<rect width="${W}" height="${H}" fill="url(#studio)"/><rect width="${W}" height="${H}" fill="url(#key)"/><path d="M0,${H*.66}H${W}" stroke="rgba(255,255,255,.04)"/>`;
  let body=render(S.objs,S.cam);
  if(S.bg==='render')body=body.replace('<g opacity=".16" mask="url(#refl)">','<g opacity=".16">');
  const fog=S.fog?`<rect width="${W}" height="${H*.34}" fill="url(#fogG)"/>`:'';
  $('vpsvg').setAttribute('viewBox',`0 0 ${W} ${H}`);$('vpsvg').setAttribute('width',W);$('vpsvg').setAttribute('height',H);
  $('vpsvg').innerHTML=DEFS+bg+body+fog;
  vp.style.background=S.bg==='render'?'#0b0b0d':S.fog?'linear-gradient(180deg,#59606b 0%,#3b4049 40%,#2a2d33 100%)':'';
  const at=p=>S.cam.proj(p);
  $('vpov').innerHTML=ST[cur].vp(S,at)+viewCube(S.cam)+triad(S.cam)+`<div class="fl nav"><span class="rbb">${ic('orbit',16)}</span><span class="rbb">${ic('hand',16)}</span><span class="rbb">${ic('zoom',16)}</span><span class="rbb">${ic('fit',16)}</span><span class="rbb">${ic('display',16)}</span><span class="rbb">${ic('section',16)}</span></div>`;
}
function drawProbe(){
  const svg=$('probe'),split=$('split').getBoundingClientRect(),pa=document.getElementById('pa');if(!pa||!lastScene){svg.innerHTML='';return}
  const r=pa.getBoundingClientRect(),vr=$('vp').getBoundingClientRect();const pp=lastScene.cam.proj(lastScene.probe);
  const A=[vr.left-split.left+pp[0],vr.top-split.top+pp[1]];
  let B=[r.left-split.left,r.top-split.top+r.height/2];
  if(pa.tagName.toLowerCase()==='path'||pa.tagName.toLowerCase()==='g'||pa.tagName.toLowerCase()==='rect'||pa.tagName.toLowerCase()==='circle'){B=[r.left-split.left+r.width*.5,r.top-split.top+r.height*.5];if(pa.tagName.toLowerCase()==='rect'&&r.width>60)B=[r.left-split.left,r.top-split.top+r.height/2]}
  if(pa.tagName.toLowerCase()==='tr')B=[r.left-split.left+2,r.top-split.top+r.height/2];
  if(pa.classList&&pa.classList.contains('otile'))B=[r.left-split.left,r.top-split.top+r.height*.45];
  if(pa.classList&&pa.classList.contains('swi'))B=[r.left-split.left+r.width/2,r.top-split.top+8];
  const dx=Math.max(80,(B[0]-A[0])*.5);const c1=[A[0]+dx,A[1]],c2=[B[0]-dx,B[1]];
  const d=`M${f1(A[0])},${f1(A[1])}C${f1(c1[0])},${f1(c1[1])} ${f1(c2[0])},${f1(c2[1])} ${f1(B[0])},${f1(B[1])}`;
  const divX=$('divider').getBoundingClientRect().left-split.left;let ly=A[1];for(let t=0;t<=1;t+=.01){const u=1-t,x=u*u*u*A[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*B[0];if(x>=divX){ly=u*u*u*A[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*B[1];break}}
  const lab=ST[cur].probeLabel,lw=lab.length*6.3+30;
  svg.innerHTML=`<path d="${d}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="4"/><path d="${d}" fill="none" stroke="#4aa3ff" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="${f1(A[0])}" cy="${f1(A[1])}" r="5" fill="#0a84ff" stroke="#fff" stroke-width="1.6"/><circle cx="${f1(A[0])}" cy="${f1(A[1])}" r="11" fill="none" stroke="#0a84ff" stroke-width="1" opacity=".6"/><circle cx="${f1(B[0])}" cy="${f1(B[1])}" r="3.6" fill="#1d1e21" stroke="#4aa3ff" stroke-width="1.6"/>
  <g transform="translate(${f1(divX-lw/2)} ${f1(ly-11)})"><rect width="${f1(lw)}" height="22" rx="11" fill="#0a84ff" stroke="rgba(0,0,0,.4)"/><g transform="translate(8 5) scale(.6)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">${IC.link}</g><text x="24" y="15" font-size="11" font-weight="600" fill="#fff">${lab}</text></g>`;
}
function setMode(m){if(!ST[m])return;cur=m;alt=false;try{history.replaceState(null,'','#'+m)}catch(e){}renderToolbar();renderSidebar();renderPane();renderViewport();requestAnimationFrame(drawProbe)}
renderChrome();
const h0=(location.hash||'').slice(1);setMode(ST[h0]?h0:'electronics');
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>setMode(cur),120)});
window.addEventListener('keydown',e=>{const i=MODES.findIndex(m=>m.id===cur);if(e.key==='ArrowRight'&&e.altKey)setMode(MODES[(i+1)%8].id);if(e.key==='ArrowLeft'&&e.altKey)setMode(MODES[(i+7)%8].id);const n=parseInt(e.key,10);if(e.metaKey&&n>=1&&n<=8){e.preventDefault();setMode(MODES[n-1].id)}});
