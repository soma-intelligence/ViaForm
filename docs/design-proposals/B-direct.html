<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViaForm Direct Canvas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0a84ff;--accent2:#409cff;--bg:#1d1e21;--tb:#2c2d31;--sep:rgba(255,255,255,.085);--t1:#ececef;--t2:#a3a4aa;--t3:#6f7077;--orange:#ff9f0a;--green:#32d74b;--red:#ff453a;--purple:#bf5af2;--yellow:#ffd60a;--teal:#64d2ff;--mat:rgba(40,41,45,.78)}
html,body{height:100%;background:#0b0c0e;overflow:hidden}
body{font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.win{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);border-radius:11px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* toolbar */
.tb{height:52px;flex:none;display:flex;align-items:center;padding:0 12px 0 20px;background:linear-gradient(#333438,#2b2c30);border-bottom:1px solid #050506;box-shadow:inset 0 -1px 0 rgba(255,255,255,.04);position:relative;z-index:20}
.lights{display:flex;gap:8px;margin-right:18px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tbtn{height:28px;min-width:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:5px;color:#c9cad0;padding:0 7px;position:relative}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.on{color:var(--accent2)}
.ttl{margin:0 14px 0 6px;line-height:1.15}
.ttl b{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.ttl span{font-size:11px;color:var(--t2)}
.ttl b em{font-style:normal;font-size:10px;font-weight:600;color:var(--t2);background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07),inset 0 1px 1px rgba(0,0,0,.25);position:absolute;left:50%;transform:translateX(-50%)}
.seg button{all:unset;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#c4c5cb;border-radius:6px;position:relative;cursor:default}
.seg button+button::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:rgba(255,255,255,.1)}
.seg button.on::before,.seg button.on+button::before{display:none}
.seg button:hover{color:#fff}
.seg button.on{background:linear-gradient(#636469,#56575c);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.22)}
.seg button.on svg{color:#6db4ff}
.seg .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 1.5px #2e2f33}
.seg .dot.run{background:none;border:1.5px solid var(--accent2);border-right-color:transparent;width:8px;height:8px;top:3px;right:3px;box-shadow:none;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tbr{margin-left:auto;display:flex;align-items:center;gap:2px}
.jobsbtn{gap:6px;padding:0 9px;font-size:12px;font-weight:500}
.vsep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 6px}
/* main */
.main{flex:1;display:flex;min-height:0}
.vp{flex:1;position:relative;overflow:hidden;background:#2a2d32}
.vp>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.glass{background:var(--mat);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.38),0 0 0 .5px rgba(0,0,0,.6)}
.rail{position:absolute;left:12px;top:12px;width:46px;border-radius:13px;padding:4px;display:flex;flex-direction:column;gap:2px;z-index:6}
.rail button{all:unset;width:38px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#d3d4d9;position:relative}
.rail button svg{width:19px;height:19px}
.rail button:hover{background:rgba(255,255,255,.08)}
.rail button.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.rail hr{border:0;height:1px;background:rgba(255,255,255,.1);margin:3px 6px}
.rail button .tip{display:none;position:absolute;left:46px;top:7px;white-space:nowrap;font-size:11.5px;background:#3a3b40;border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:6px;color:#eee;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.rail button:hover .tip{display:block}
.chip{position:absolute;border-radius:10px;padding:7px 11px;font-size:12px;display:flex;align-items:center;gap:8px;z-index:5}
.chip .k{color:var(--t2)}
.badge{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-stale{color:#ffb340;background:rgba(255,159,10,.15);box-shadow:inset 0 0 0 .5px rgba(255,159,10,.4)}
.b-ok{color:#5be07a;background:rgba(50,215,75,.13);box-shadow:inset 0 0 0 .5px rgba(50,215,75,.35)}
.b-run{color:#6db4ff;background:rgba(10,132,255,.15);box-shadow:inset 0 0 0 .5px rgba(10,132,255,.45)}
.b-mute{color:var(--t2);background:rgba(255,255,255,.07)}
.pill{position:absolute;border-radius:19px;height:38px;padding:0 5px;display:flex;align-items:center;gap:1px;z-index:7;font-size:12px;white-space:nowrap}
.pill button{all:unset;height:30px;padding:0 10px;border-radius:15px;display:flex;align-items:center;gap:6px;color:#e2e3e8}
.pill button:hover{background:rgba(255,255,255,.09)}
.pill button.pri{background:var(--accent);color:#fff}
.pill .s{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 4px}
.pill .fld{height:26px;border-radius:7px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;padding:0 8px;gap:6px;margin:0 3px}
.pill .fld .k{color:var(--t2);font-size:11px}
.pill .fld .mono{color:#fff;font-size:12px}
.pill::after{content:"";position:absolute;width:9px;height:9px;background:inherit;left:var(--ax,30px);bottom:-5px;transform:rotate(45deg);border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);display:var(--arrow,block)}
.nav{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border-radius:11px;height:36px;display:flex;align-items:center;padding:0 4px;gap:1px;z-index:5}
.nav button{all:unset;width:32px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#cfd0d5}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{color:var(--accent2)}
.nav .s{width:1px;height:16px;background:rgba(255,255,255,.12);margin:0 3px}
.cube{position:absolute;right:14px;top:12px;width:96px;height:96px;z-index:5}
.triad{position:absolute;left:18px;bottom:100px;width:64px;height:64px;z-index:5}
.activity{position:absolute;right:14px;bottom:14px;width:300px;border-radius:12px;z-index:8;overflow:hidden;transition:opacity .15s,transform .15s}
.activity.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.activity h4{font-size:11px;font-weight:600;color:var(--t2);padding:9px 12px 5px;display:flex;justify-content:space-between}
.job{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:6px 12px;align-items:center;border-top:1px solid var(--sep)}
.job .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .m{font-size:11px;color:var(--t2);grid-column:2/4}
.job .bar{grid-column:2/4;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.job .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.job .ic{grid-row:1/4;align-self:start;margin-top:1px;color:var(--t2)}
.caption{position:fixed;left:12px;bottom:12px;z-index:50;max-width:430px;border-radius:9px;padding:7px 11px;font-size:11.5px;line-height:1.35;background:rgba(10,10,12,.82);border:1px solid rgba(255,255,255,.14);color:#d8d9de}
.caption b{color:#fff;font-weight:600}
/* inspector */
.insp{width:304px;flex:none;background:#25262a;border-left:1px solid #050506;display:flex;flex-direction:column;min-height:0;box-shadow:inset 1px 0 0 rgba(255,255,255,.04)}
.ihead{padding:10px 12px 10px;border-bottom:1px solid var(--sep)}
.lbl{font-size:11px;font-weight:600;color:var(--t2);display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lbl a{color:var(--accent2);font-weight:500;text-decoration:none}
.lineage{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:0 2px}
.lineage::before{content:"";position:absolute;left:18px;right:18px;top:15px;height:1px;background:rgba(255,255,255,.14)}
.ln{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:36px;z-index:1}
.ln .c{width:30px;height:30px;border-radius:50%;background:#34353a;display:flex;align-items:center;justify-content:center;color:#cfd0d5;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 3px #25262a}
.ln .c svg{width:15px;height:15px}
.ln span{font-size:9.5px;color:var(--t2);white-space:nowrap}
.ln.cur .c{background:var(--accent);color:#fff;box-shadow:0 0 0 3px #25262a,0 0 0 4px rgba(10,132,255,.5)}
.ln.cur span{color:#fff}
.ln .st{position:absolute;top:-2px;right:-1px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #25262a}
.ln .st.stale{background:var(--orange)}.ln .st.ok{background:var(--green)}.ln .st.run{background:var(--accent2)}
.ln:hover .c{filter:brightness(1.25)}
.flowmsg{margin-top:10px;font-size:11.5px;color:#d0d1d6;line-height:1.4;background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.25);border-radius:8px;padding:7px 9px;display:flex;gap:8px;align-items:flex-start}
.flowmsg.okm{background:rgba(50,215,75,.07);border-color:rgba(50,215,75,.22)}
.flowmsg.runm{background:rgba(10,132,255,.08);border-color:rgba(10,132,255,.3)}
.flowmsg svg{margin-top:1px;flex:none}
.flowmsg button{all:unset;color:var(--accent2);font-weight:600;margin-left:4px}
.iseg{display:flex;background:rgba(0,0,0,.25);border-radius:7px;padding:2px;margin:10px 12px 4px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07)}
.iseg button{all:unset;flex:1;text-align:center;height:22px;line-height:22px;font-size:11.5px;font-weight:500;border-radius:5px;color:#c4c5cb}
.iseg button.on{background:#58595e;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ibody{flex:1;overflow:auto;padding:4px 6px 8px;min-height:0}
.ibody::-webkit-scrollbar{width:0}
.sh{font-size:11px;font-weight:600;color:var(--t3);padding:10px 8px 4px;display:flex;justify-content:space-between}
.row{height:26px;display:flex;align-items:center;gap:7px;padding:0 8px;border-radius:6px;font-size:12.5px;color:#e4e5ea;white-space:nowrap}
.row:hover{background:rgba(255,255,255,.05)}
.row.sel{background:var(--accent);color:#fff}
.row.sel .meta,.row.sel svg{color:#fff}
.row svg{color:#9fa0a6}
.row .ch{width:10px;color:var(--t3);font-size:9px}
.row .meta{margin-left:auto;font-size:11px;color:var(--t3);display:flex;gap:5px;align-items:center}
.row.ind1{padding-left:24px}.row.ind2{padding-left:40px}
.row .lk{color:var(--accent2)!important}
.row.sel .lk{color:#fff!important}
.row.dim{color:var(--t3)}
.cards{border-top:1px solid var(--sep);padding:8px 12px 12px;flex:none}
.card{background:#2e2f34;border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px 10px;margin-top:8px;font-size:11.5px}
.card .t{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px;margin-bottom:6px}
.card .t .badge{margin-left:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;color:var(--t2)}
.kv b{color:#e8e9ee;font-weight:500;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px 2px 5px;border-radius:5px;background:rgba(255,255,255,.06);color:#d6d7dc;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.lnk svg{width:12px;height:12px}
.lnk.st{color:#ffb340;background:rgba(255,159,10,.1)}
.btnrow{display:flex;gap:6px;margin-top:8px}
.mbtn{all:unset;height:22px;padding:0 10px;border-radius:6px;font-size:11.5px;font-weight:500;background:#4a4b50;color:#fff;box-shadow:0 .5px 1px rgba(0,0,0,.4),inset 0 .5px 0 rgba(255,255,255,.15);display:inline-flex;align-items:center;gap:5px}
.mbtn.pri{background:var(--accent)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.thumbrow{display:flex;gap:6px;margin-top:6px}
/* misc in-viewport panels */
.vpanel{position:absolute;border-radius:12px;z-index:5;font-size:12px}
.hud .kv{grid-template-columns:auto auto;gap:4px 18px}
.gx{position:absolute;inset:0;z-index:2}
.fade-in{animation:fi .22s ease-out}
@keyframes fi{from{opacity:.0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="tbtn" title="Projects"><svg class="i" data-i="sidebar"></svg></div>
    <div class="ttl"><b>Racer 3in <em>v8</em></b><span>ViaForm Projects · Edited</span></div>
    <div class="tbtn"><svg class="i" data-i="undo"></svg></div>
    <div class="tbtn"><svg class="i" data-i="redo"></svg></div>
    <div class="seg" id="seg"></div>
    <div class="tbr">
      <div class="tbtn jobsbtn on" id="jobsBtn" title="Activity"><svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="7" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/><circle cx="9" cy="9" r="7" fill="none" stroke="#409cff" stroke-width="2" stroke-dasharray="44" stroke-dashoffset="17" transform="rotate(-90 9 9)" stroke-linecap="round"/></svg><span>3 jobs</span></div>
      <div class="vsep"></div>
      <div class="tbtn"><svg class="i" data-i="search"></svg></div>
      <div class="tbtn"><svg class="i" data-i="share"></svg></div>
      <div class="tbtn on" id="inspBtn"><svg class="i" data-i="inspector"></svg></div>
    </div>
  </div>
  <div class="main">
    <div class="vp" id="vp">
      <div id="scene"></div>
      <div class="rail glass" id="rail"></div>
      <div id="over"></div>
      <svg class="cube" id="cube" viewBox="0 0 96 96"></svg>
      <svg class="triad" id="triad" viewBox="0 0 64 64"></svg>
      <div class="nav glass" id="nav"></div>
      <div class="activity glass" id="activity"></div>
    </div>
    <div class="insp" id="insp">
      <div class="ihead">
        <div class="lbl"><span>Lineage</span><a id="lnMode">Frame v8 → Export</a></div>
        <div class="lineage" id="lineage"></div>
        <div id="flowmsg"></div>
      </div>
      <div class="iseg" id="iseg"></div>
      <div class="ibody" id="ibody"></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
</div>
<div class="caption"><b>B. Direct Canvas</b>. The model fills the window; tools float beside it and one inspector carries the lineage, so every discipline reads and feeds the same selection.</div>
<script>
const I={
sidebar:'<rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13M4.5 6.5h1.2M4.5 9h1.2"/>',

design:'<path d="m10 2.5 6.5 3.7v7.6L10 17.5l-6.5-3.7V6.2Z"/><path d="M3.5 6.2 10 10l6.5-3.8M10 10v7.5"/>',

asm:'<circle cx="6" cy="6" r="2.6"/><circle cx="14" cy="14" r="2.6"/><path d="M7.9 7.9l4.2 4.2"/><path d="M11 3.5h5.5V9M9 16.5H3.5V11"/>',

train:'<circle cx="4.5" cy="6" r="1.8"/><circle cx="4.5" cy="14" r="1.8"/><circle cx="10" cy="4" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="10" cy="16" r="1.8"/><circle cx="15.5" cy="10" r="1.8"/><path d="M6.2 6.6 8.3 9.3M6.2 5.4l2-1M6.2 13.4l2-2.6M6.2 14.6l2 1M11.7 4.8l2.3 4M11.8 10h1.9M11.7 15.2l2.3-4"/>',
render:'<circle cx="10" cy="10" r="3.2"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3"/>',
mfg:'<path d="M5.5 7.5V3h9v4.5"/><rect x="2.5" y="7.5" width="15" height="6.5" rx="1.5"/><path d="M5.5 12v5h9v-5"/><path d="M7.5 14.5h5"/>',
select:'<path d="M5 3l10 6.2-4.3 1.1 2.7 5-1.8 1-2.7-5-3.1 3.1Z"/>',
sketch:'<path d="M3.5 16.5l1-4L13 4a1.8 1.8 0 0 1 2.6 2.6L7.5 15.1Z"/><path d="m11.6 5.4 2.6 2.6"/>',
rect:'<rect x="3.5" y="5" width="13" height="10" rx="1"/>',
circle:'<circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r=".6" fill="currentColor"/>',
extrude:'<path d="M3.5 13.5 10 17l6.5-3.5L10 10Z"/><path d="M10 10V2.5M7.5 5 10 2.5 12.5 5"/>',

function cubeSVG(V){if(!V)return'';const o=V.o;const C=View({cx:48,cy:50,s:17,yaw:o.yaw,pitch:o.pitch});

 let s='';const ring=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI*2;ring.push(C.P(1.7*Math.cos(a),1.7*Math.sin(a),-1))}
 s+=`<path d="M${ring.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/>`;
 F.filter(f=>C.facing(f.n)).forEach(f=>{const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>C.P(f.c[0]+f.u[0]*a+f.v[0]*b,f.c[1]+f.u[1]*a+f.v[1]*b,f.c[2]+f.u[2]*a+f.v[2]*b));
  const r=C.rot(f.n);const lam=Math.max(0,r[0]*LIGHT[0]+r[1]*LIGHT[1]+r[2]*LIGHT[2]);const g=Math.round(92+lam*58);
  s+=`<path d="M${pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}Z" fill="rgb(${g},${g+3},${g+9})" fill-opacity=".92" stroke="rgba(235,236,240,.7)" stroke-width=".8" stroke-linejoin="round"/>`;
  const O=C.P(...f.c),U=C.P(f.c[0]+f.u[0],f.c[1]+f.u[1],f.c[2]+f.u[2]),W=C.P(f.c[0]+f.v[0],f.c[1]+f.v[1],f.c[2]+f.v[2]);
  const k=f.t.length>4?1/120:1/100;let ux=U[0]-O[0],uy=U[1]-O[1],vx=W[0]-O[0],vy=W[1]-O[1];if(ux*vy-uy*vx<0){ux=-ux;uy=-uy}if(vy<0&&Math.abs(vy)>Math.abs(vx)*.3){ux=-ux;uy=-uy;vx=-vx;vy=-vy}
  s+=`<text transform="matrix(${(ux*k).toFixed(4)} ${(uy*k).toFixed(4)} ${(vx*k).toFixed(4)} ${(vy*k).toFixed(4)} ${O[0].toFixed(1)} ${O[1].toFixed(1)})" font-size="40" font-weight="700" fill="rgba(255,255,255,.9)" text-anchor="middle" dominant-baseline="central">${f.t}</text>`});
 return s}

function renderJobs(){const a=document.getElementById('activity');a.innerHTML=jobsHTML();a.classList.toggle('hide',!S.jobs)}
function setMode(m){if(!VP[m])return;S.mode=m;try{history.replaceState(null,'','#'+m)}catch(e){}renderSeg();renderRail();renderInsp();renderScene()}
document.getElementById('seg').style.zIndex=2;document.getElementById('scene').style.cssText='position:absolute;inset:0';
document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){setMode(m.dataset.m);return}
 const g=e.target.closest('[data-go]');if(g&&g.dataset.go){setMode(g.dataset.go);return}
 const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;renderInsp();return}
 const f=e.target.closest('[data-fix]');if(f){const k=f.dataset.fix;const chain={design:['elec','sim','train','render'],elec:['elec'],sim:['sim'],train:['train'],render:['render']}[k]||[];chain.forEach(c=>delete S.stale[c]);renderSeg();renderInsp();renderScene();return}
 if(e.target.closest('#jobsBtn')){S.jobs=!S.jobs;renderJobs();document.getElementById('jobsBtn').classList.toggle('on',S.jobs);return}
 if(e.target.closest('#inspBtn')){S.insp=!S.insp;document.getElementById('insp').style.display=S.insp?'':'none';document.getElementById('inspBtn').classList.toggle('on',S.insp);renderScene()}});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey){const i=+e.key;if(i>=1&&i<=8){e.preventDefault();setMode(MODES[i-1][0])}}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderScene,80)});
hydrate();renderNav();renderJobs();
{const h=location.hash.slice(1);setMode(VP[h]?h:'design')}
</script>
