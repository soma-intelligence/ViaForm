name: SolidCraftNative
options:
  bundleIdPrefix: me.somalabs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/../bridge/include
    OTHER_LDFLAGS: ["-lsolidcraft_ffi", "-lc++"]
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SolidCraft
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SolidCraft-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Touch
    settings:
      base:
        PRODUCT_NAME: SolidCraft
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.solidcraft
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  SolidCraft-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Desk
    settings:
      base:
        PRODUCT_NAME: SolidCraft
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.solidcraft.mac
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/aarch64-apple-darwin/release
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
