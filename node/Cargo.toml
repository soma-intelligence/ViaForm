[package]
name = "viaform-node"
description = "Node addon over the ViaForm core, for the Electron front end"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
viaform-core.workspace = true
serde_json.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
