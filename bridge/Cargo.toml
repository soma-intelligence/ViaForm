[package]
name = "solidcraft-ffi"
description = "C ABI over the SolidCraft (CAD) and PCBCraft (PCB) engines for the native Swift front ends"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
solidcraft-engine = { path = "../engines/solidcraft/crates/engine" }
pcbcraft-engine = { path = "../engines/pcbcraft/crates/engine" }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Same vendored truck fixes as the core workspace: patches only apply from the root workspace.
[patch.crates-io]
truck-geometry = { path = "../engines/solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "../engines/solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "../engines/solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "../engines/solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "../engines/solidcraft/vendor/matext4cgmath" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
