<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>ViaForm</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Application bar: data panel, file, save, undo and redo, document tabs; search and help on the right. -->
    <header id="appbar">
      <div id="appbar-left"></div>
      <div id="doctabs"></div>
      <div id="appbar-right"></div>
    </header>
    <!-- Toolbar: workspace menu and tabs, then the panels of the active tab. -->
    <nav id="ribbon">
      <div id="tabs"></div>
      <div id="toolbar"></div>
    </nav>
    <div id="update-banner" hidden></div>
    <main id="stage">
      <div id="view3d"></div>
      <div id="sheet" hidden><canvas id="sheet-canvas"></canvas></div>
      <div id="sim" hidden></div>
      <aside id="browser"></aside>
      <aside id="inspector"></aside>
      <section id="dialog" hidden></section>
      <div id="pills"></div>
      <div id="navbar"></div>
      <aside id="datapanel" hidden></aside>
    </main>
    <footer id="timeline"></footer>
    <div id="menu-layer" hidden></div>
    <div id="palette" hidden>
      <div class="palette-box">
        <input id="palette-input" placeholder="Search every command…" spellcheck="false" />
        <ul id="palette-list"></ul>
      </div>
    </div>
    <dialog id="about"></dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
