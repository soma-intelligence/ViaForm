# One workspace for the shared core and both front-end bindings, so they build against one
# copy of each engine.
[workspace]
resolver = "3"
members = ["core", "bridge", "node", "generative", "sim", "library", "bom", "fluid", "kin", "phys", "pcb"]
# The engines are workspaces of their own.
exclude = ["engines"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
solidcraft-engine = { path = "engines/solidcraft/crates/engine" }
pcbcraft-engine = { path = "engines/pcbcraft/crates/engine" }
pcbcraft-io = { path = "engines/pcbcraft/crates/io" }
viaform-core = { path = "core" }
viaform-library = { path = "library" }
viaform-generative = { path = "generative" }
viaform-sim = { path = "sim" }
viaform-bom = { path = "bom" }
viaform-fluid = { path = "fluid" }
viaform-kin = { path = "kin" }
viaform-phys = { path = "phys" }
viaform-pcb = { path = "pcb" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# SolidCraft's own patches (egui-wgpu, winit, accesskit) only touch its UI crates, which the
# core does not build, so no patch section is needed here.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
